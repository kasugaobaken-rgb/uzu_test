<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UZU SEARCH / 正式版へ接続</title>
  <style>
    :root{color-scheme:dark;--bg:#08091a;--panel:#171a37;--line:#65c9ff55;--mint:#70f7d4;--pink:#ff72d7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#70f7d433,transparent 34rem),radial-gradient(circle at 90% 85%,#ff72d72b,transparent 30rem),var(--bg);color:#f7fbff;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
    main{width:min(620px,100%);padding:36px;border:1px solid var(--line);background:#171a37d9;box-shadow:8px 8px 0 #03040e}
    p{color:#a6b3ce;line-height:1.8}.label{color:var(--mint);font:700 11px/1 monospace;letter-spacing:.18em}a{display:block;margin-top:24px;padding:14px;text-align:center;text-decoration:none;background:var(--mint);color:#07110f;font-weight:700}body.pixel main{border:4px solid var(--pink);border-radius:0}body.pixel,body.pixel *{font-family:"DotGothic16","Hiragino Kaku Gothic ProN",monospace}
  </style>
</head>
<body>
  <main>
    <p class="label">UZU / SEARCH INDEX</p>
    <h1>正式検索システムへ接続します</h1>
    <p>検索記事・設問・段階管理は公開用サイトへ統合されました。PC指定、段階指定、ドット絵指定を維持したまま移動します。</p>
    <a id="move" href="https://uzu-2067-search-test.borusiti880.chatgpt.site/">接続する</a>
  </main>
  <script>
    const target = new URL("https://uzu-2067-search-test.borusiti880.chatgpt.site/");
    target.search = location.search;
    document.getElementById("move").href = target.href;
    if (target.searchParams.get("mode") === "pixel") document.body.classList.add("pixel");
    window.setTimeout(() => location.replace(target.href), 350);
  </script>
</body>
</html>

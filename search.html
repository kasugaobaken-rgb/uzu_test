<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第一テスト — 2067年の学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c0e;--pan:#151a1e;--pan2:#1c232a;--ln:#2b333b;
      --fg:#e4ebf0;--dim:#7d8892;--acc:#5fd3c8;--wrn:#ff7a45;--glw:#ffd166}
html,body{background:var(--bg);color:var(--fg);
 font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.7}
body{max-width:820px;margin:0 auto;padding:0 0 92px}
button{font-family:inherit;font-size:15px;background:var(--pan2);color:var(--fg);
 border:1px solid var(--ln);padding:13px 14px;cursor:pointer;border-radius:6px}
button:active:not(:disabled){transform:scale(.97)}
button.pri{background:var(--acc);color:#06110f;border-color:var(--acc);font-weight:700}
input{font-family:inherit;font-size:17px;background:var(--pan2);color:var(--fg);
 border:1px solid var(--ln);padding:13px;width:100%;border-radius:6px}
.hide{display:none!important}
.hint{font-size:12px;color:var(--dim)}

.lb{max-width:400px;margin:44px auto;padding:0 18px;display:flex;flex-direction:column;gap:12px}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.hd{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--acc);padding:8px 0}
.hd.unl{border-color:var(--wrn)}
.hd1,.tabs{padding:0 12px}
.hd1{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
.hd1 b{color:var(--fg)}
.tm{font-size:26px;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.tm.hot{color:var(--wrn);animation:bl .8s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.tab{padding:11px 4px;border-radius:8px;background:var(--pan);border:1px solid var(--ln);
 text-align:center;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);color:#06110f;border-color:var(--acc);font-weight:700}
.pane{padding:12px}

.sb{display:flex;gap:7px;margin-bottom:12px}
.sb input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:7px 11px;border:1px solid var(--ln);border-radius:16px;
 background:var(--pan);cursor:pointer;color:var(--dim)}
.chip:active{background:var(--pan2)}
.hit{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:12px 13px;
 margin-bottom:9px;cursor:pointer}
.hit .src{font-size:11px;color:var(--dim);letter-spacing:.08em}
.hit .ti{font-size:15.5px;font-weight:700;margin:3px 0 4px;line-height:1.45}
.hit .ld{font-size:13px;color:#aeb8c0;line-height:1.6}
.hit.locked{border-color:var(--wrn);background:rgba(255,122,69,.07)}
.hit.locked .src{color:var(--wrn)}
.art{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:16px}
.art h3{font-size:18px;line-height:1.5;margin:6px 0 10px}
.art p{margin-bottom:12px;font-size:14px}
.art .meta{font-size:11px;color:var(--dim);letter-spacing:.08em}
.art .rest{border-left:3px solid var(--wrn);padding-left:12px;margin-top:14px}
.art .rest .cap{font-size:11px;color:var(--wrn);letter-spacing:.14em;margin-bottom:5px}
.none{color:var(--dim);font-size:13.5px;padding:18px 4px;line-height:1.9}

.q{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:13px;margin-bottom:10px}
.q.ok{border-color:var(--acc);background:rgba(95,211,200,.07)}
.q .n{font-size:11px;letter-spacing:.16em;color:var(--acc)}
.q .tx{font-size:14.5px;margin:5px 0 9px;line-height:1.7}
.q .cross{font-size:11px;color:var(--glw);margin-bottom:7px}
.q .row{display:flex;gap:7px}
.q .row input{flex:1;font-size:15px;padding:10px}
.banner{margin:10px 12px;padding:13px 15px;border-radius:8px;font-size:14px;line-height:1.75;
 background:rgba(255,122,69,.12);border:2px solid var(--wrn)}
.banner .big{font-size:17px;font-weight:700;display:block;margin-bottom:4px;color:var(--wrn)}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
 border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px}
.bot button{flex:1}
</style>

<div id="lobby" class="lb">
  <div style="text-align:center;letter-spacing:.2em;color:var(--acc)">第 一 テ ス ト</div>
  <div class="hint" style="text-align:center">2067年の学習 ／ 20分</div>
  <div style="margin-top:8px">個体を選択してください</div>
  <div class="seats" id="seats"></div>
  <div class="hint">端末ごとに別の個体を選んでください。同じ言葉で検索しても、個体ごとに違う結果が返ります。</div>
</div>

<div id="app" class="hide">
  <div class="hd" id="hd">
    <div class="hd1">
      <span id="who"></span>
      <span id="qdone"></span>
      <span class="tm" id="tm">20:00</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="q">設問<span id="qn"></span></div>
      <div class="tab" data-tab="s">検索</div>
    </div>
  </div>
  <div id="banner"></div>
  <div class="pane" id="pq"></div>
  <div class="pane hide" id="ps">
    <div class="sb"><input id="kw" placeholder="調べたい言葉を入力"><button class="pri" id="go">検索</button></div>
    <div class="chips" id="chips"></div>
    <div id="res"></div>
  </div>
  <div class="bot" id="bot"></div>
</div>

const HINT={1:["2067年 社会","自動運転","意識 データ化","ゴースト"],
            2:["2067年 社会","自動運転","遺体未確認","行方不明"],

            5:["2067年 社会","自動運転","東西勢力","違法義体"]};

const $=i=>document.getElementById(i);
let me=null, left=MIN*60, timer=null, unlocked=false, done=[], tab="q", open=null;

$("seats").innerHTML=P5.map((n,i)=>`<button data-s="${i+1}">${n}<br><span class="hint">${ROLE[i]}</span></button>`).join("");
$("seats").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>start(+b.dataset.s));

function start(n){
  me=n; done=Q[n].map(()=>false);
  $("lobby").classList.add("hide"); $("app").classList.remove("hide");
  $("who").innerHTML=`<b>${P5[n-1]}</b>・${ROLE[n-1]}`;
  $("chips").innerHTML=HINT[n].map(k=>`<span class="chip" data-k="${k}">${k}</span>`).join("");
  $("chips").querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{$("kw").value=e.dataset.k;search()});
  timer=setInterval(tick,1000);
  render();
}
function tick(){
  left--;
  const m=Math.floor(left/60), s=left%60;
  $("tm").textContent=m+":"+String(s).padStart(2,"0");
  $("tm").className="tm"+(left<=UNLOCK_AT?" hot":"");
  if(!unlocked && left<=UNLOCK_AT){ unlocked=true; onUnlock(); }
  if(left<=0){ clearInterval(timer); $("tm").textContent="0:00"; }
}
function onUnlock(){
  $("hd").classList.add("unl");
  $("banner").innerHTML=`<div class="banner"><span class="big">検索制御層 ── 応答なし</span>
    情報の選別処理が停止しました。<br>
    <b>これまで結果から除外されていた記録が、閲覧可能になっています。</b><br>
    <span class="hint">既に読んだ記事にも、削除されていた部分が復元されています。</span></div>`;
  if(navigator.vibrate)navigator.vibrate([90,60,90,60,160]);
  if(tab==="s")search();
}
document.querySelectorAll(".tab").forEach(e=>e.onclick=()=>{
  tab=e.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===tab));
  $("pq").classList.toggle("hide",tab!=="q"); $("ps").classList.toggle("hide",tab!=="s");
  render();
});
$("go").onclick=search;
$("kw").addEventListener("keydown",e=>{if(e.key==="Enter")search()});

function visible(a){
  if(a.lock && !unlocked) return false;
  return a.pc===null || a.pc.includes(me);
}
function search(){
  open=null;
  const kw=$("kw").value.trim();
  if(!kw){ $("res").innerHTML='<div class="none">言葉を入力して検索してください。</div>'; return; }
  const hit=ART.filter(a=>visible(a) &&
    (a.k.some(x=>x.includes(kw)||kw.includes(x)) || a.t.includes(kw) || a.b.join("").includes(kw)));
  $("res").innerHTML = hit.length
    ? hit.map(a=>`<div class="hit ${a.lock?"locked":""}" data-a="${a.id}">
        <div class="src">${a.src}　${a.sec}　${a.d}</div>
        <div class="ti">${a.t}</div><div class="ld">${a.l}</div></div>`).join("")
    : `<div class="none">該当する記録は見つかりませんでした。<br>
        <span class="hint">別の言い方を試してください。検索結果は、個体ごとに異なります。</span></div>`;
  $("res").querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>{open=e.dataset.a;showArt()});
}
function showArt(){
  const a=ART.find(x=>x.id===open);
  $("res").innerHTML=`<div class="art">
    <div class="meta">${a.src}　${a.sec}　${a.d}</div>
    <h3>${a.t}</h3>${a.b.map(p=>`<p>${p}</p>`).join("")}
    ${(a.rest&&unlocked)?`<div class="rest"><div class="cap">復元された部分</div><p>${a.rest}</p></div>`:""}
    </div>`;
  render();
}
function render(){
  $("qn").textContent=" "+done.filter(Boolean).length+"/"+done.length;
  $("qdone").textContent = done.every(Boolean) ? "設問クリア" : "";
  $("pq").innerHTML=Q[me].map((q,i)=>`<div class="q ${done[i]?"ok":""}">
    <div class="n">設問 ${i+1}${done[i]?"　✅ 正解":""}</div>
    ${q.x?`<div class="cross">◆ この答えは、あなたの検索網には出てきません。${q.x}の個体に聞いてください。</div>`:""}
    <div class="tx">${q.t}</div>
    ${done[i]?"":`<div class="row"><input id="a${i}" placeholder="答えを入力"><button data-q="${i}">回答</button></div>`}
  </div>`).join("");
  $("pq").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q, v=$("a"+i).value.trim();
    if(!v)return;
    if(Q[me][i].a.some(x=>v.includes(x))){ done[i]=true; render(); }
    else { b.textContent="違います"; setTimeout(()=>b.textContent="回答",1200); }
  });
  $("bot").innerHTML = tab==="q"
    ? `<button class="pri" onclick="document.querySelector('[data-tab=s]').click()">検索する →</button>`
    : (open ? `<button onclick="open=null;search()">← 検索結果へ戻る</button>` : "");
}

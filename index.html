<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記録照合フェーズ — DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c0e; --pan:#151a1e; --pan2:#1c232a; --ln:#2b333b;
  --fg:#e4ebf0; --dim:#7d8892; --acc:#5fd3c8; --wrn:#ff7a45; --glw:#ffd166;
  --phase:var(--acc);
}
html,body{background:var(--bg);color:var(--fg);
  font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body{max-width:820px;margin:0 auto;padding:0 0 84px}
button{font-family:inherit;font-size:15px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px 14px;cursor:pointer;border-radius:6px;
  transition:transform .06s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.28}
button.pri{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
button.dgr{border-color:var(--wrn);color:var(--wrn)}
input{font-family:inherit;font-size:17px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px;width:100%;border-radius:6px}
.hide{display:none !important}
.hint{font-size:12px;color:var(--dim)}

/* ---------- ロビー ---------- */
.lb{max-width:400px;margin:44px auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* ---------- ヘッダ ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:2px solid var(--phase);padding:8px 0 9px}
.hd1,.hd2{padding:0 12px}
.pane{padding-top:10px}
.hd1{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim)}
.hd1 b{color:var(--fg);letter-spacing:.06em}
.hd2{display:flex;align-items:center;gap:12px;margin-top:2px}
.pill{font-size:13px;letter-spacing:.16em;color:#06110f;background:var(--phase);
  padding:3px 12px;border-radius:20px;font-weight:700}
.tm{font-size:30px;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums;
  color:var(--phase)}
.tm.hot{color:var(--wrn);animation:bl .8s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}

/* ---------- 指示バナー ---------- */
.cue{margin:10px 12px 0;padding:12px 14px;border-radius:8px;font-size:15px;
  background:var(--pan);border:1px solid var(--phase);line-height:1.6}
.cue.turn{background:rgba(255,122,69,.14);border-color:var(--wrn);border-width:2px}
.cue b{color:var(--fg)}
.cue .big{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.msg{margin:8px 12px 0;padding:10px 13px;border-radius:8px;font-size:14px;
  background:var(--pan);border:1px solid var(--ln)}
.msg.w{border-color:var(--wrn);color:#ffc7ad}
.msg.s{border-color:var(--glw);color:var(--glw);background:rgba(255,209,102,.08)}

/* ---------- タブ ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;background:var(--bg);padding:9px 12px 0}
.tab{padding:11px 4px;border-radius:8px;background:var(--pan);border:1px solid var(--ln);
  text-align:center;font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
.tab .n{font-size:11px;opacity:.7;margin-left:3px}
.pane{padding:0 12px}

/* ---------- 自分の手札 ---------- */
.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cd{border:1px solid var(--ln);background:var(--pan);border-radius:8px;padding:11px;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;
  min-height:150px}
.cd.sel{border-color:var(--acc);background:#16262a;box-shadow:0 0 0 2px var(--acc)}
.cd.own{border-color:var(--glw)}
.cd.own::before{content:"";position:absolute;inset:0;border-radius:8px;
  box-shadow:0 0 14px rgba(255,209,102,.3) inset;pointer-events:none}
.ci{font-size:10px;color:var(--dim);letter-spacing:.12em}
.ck{font-size:12px;letter-spacing:.1em;font-weight:700}
.crec .ck{color:#8fb8d8}.cmem .ck{color:#d3aee0}.ceff .ck{color:var(--wrn)}.cjok .ck{color:#9aa4ac}
.ct{font-size:13px;line-height:1.6;flex:1}
.tg{position:absolute;top:8px;right:9px;font-size:12px;color:var(--glw)}
.selno{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;
  background:var(--acc);color:#06110f;font-size:13px;font-weight:700;
  display:grid;place-items:center}
/* 直前に手札へ入ったカード */
.cd.new{border-color:var(--acc);animation:pop .45s ease-out}
.newtag{position:absolute;top:-7px;left:-6px;background:var(--acc);color:#06110f;
  font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:10px}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.cd.new{animation:none}}

/* ---------- 場（他の個体） ---------- */
.pc{background:var(--pan);border:1px solid var(--ln);border-radius:8px;
  padding:11px;margin-bottom:9px}
.pc.act{border-color:var(--wrn);box-shadow:0 0 0 1px var(--wrn)}
.pc.nmd{opacity:.42}
.pc.tgt{border-color:var(--glw);box-shadow:0 0 0 2px var(--glw);cursor:pointer}
.pt{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.pt .nm{font-size:16px;font-weight:700;color:var(--fg)}
.pt .d{margin-left:auto;font-size:20px;color:var(--glw);font-variant-numeric:tabular-nums}
.pt .now{font-size:11px;background:var(--wrn);color:#180a04;padding:2px 8px;border-radius:20px;font-weight:700}
.pm{font-size:12px;color:var(--dim);margin-bottom:8px}
.mn{font-size:12.5px;line-height:1.55;border:1px solid var(--glw);color:var(--glw);
  background:rgba(255,209,102,.07);padding:8px 10px;margin-top:6px;border-radius:6px}
.mn .mid{font-size:10px;opacity:.7;letter-spacing:.1em;display:block}

/* 伏せ札のスロット */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:9px}
.slot{aspect-ratio:3/4;border:1px dashed var(--ln);background:#0d1216;border-radius:6px;
  display:grid;place-items:center;font-size:17px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.slot.rv{border:2px solid var(--glw);color:var(--glw);font-size:10px;letter-spacing:0}
.slot.tap{border:2px solid var(--glw);color:var(--glw);background:rgba(255,209,102,.12);
  cursor:pointer;font-size:19px;box-shadow:0 0 12px rgba(255,209,102,.25)}
.pickbtn{width:100%;margin-top:9px;border-color:var(--glw);color:var(--glw);
  background:rgba(255,209,102,.08);font-weight:700}
.stealhint{margin-top:9px;font-size:13px;color:var(--glw);text-align:center}

/* 照会ボード */
.inq{margin:8px 12px 0;padding:11px 13px;border-radius:8px;
  background:rgba(95,211,200,.07);border:1px solid var(--acc)}
.inq.priv{background:rgba(255,209,102,.08);border-color:var(--glw)}
.inq.priv .ih{color:var(--glw)}
.inq .ih{font-size:13px;color:var(--acc);font-weight:700}
.inq .ib{font-size:13.5px;line-height:1.6;margin:5px 0 9px}
.inq button{width:100%;padding:11px}
/* 相手を選ぶ */
.askbox{margin:8px 12px 0;padding:11px 13px;border-radius:8px;
  background:rgba(255,209,102,.09);border:2px solid var(--glw)}
.askbox .al{font-size:14px;color:var(--glw);margin-bottom:8px}
.askbox .tgts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.askbox .tgts button{padding:11px 2px;font-size:13px;border-radius:6px}

/* ---------- 情報・ログ ---------- */
.log{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:10px;
  font-size:13px;line-height:1.6}
.log>div{padding:7px 0;border-bottom:1px solid #202830}
.log>div:last-child{border-bottom:none}
.log .me{color:var(--acc)}
/* 情報データの1件 */
.ie .it{font-size:13.5px;line-height:1.6}
.ie.me .it{color:var(--acc)}
/* 魂の記憶：共有できない */
.ie.soul{border-left:3px solid var(--glw);padding-left:10px;margin:2px 0}
.ie.soul .it{color:var(--glw)}
.ie.soul.weak .it{color:#a99263}
.ie .sl{font-size:11px;letter-spacing:.12em;color:var(--glw);margin-bottom:3px}
.ie.soul.weak .sl{color:#a99263}
.ir{display:flex;align-items:center;gap:10px;margin-top:4px}
.shb{padding:5px 12px;font-size:12px;margin-left:auto;border-radius:14px}
.tgts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.tgts button{padding:9px 2px;font-size:12px;border-radius:6px}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:16px 0 7px}

/* ---------- 下部アクション ---------- */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--ln);
  box-shadow:0 -10px 22px rgba(0,0,0,.7);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:7px;flex-wrap:wrap}
.bot button{flex:1 1 44%;padding:15px 6px;font-size:15px}
.bot button.pri{flex-basis:100%}

@media(min-width:700px){
  .hand{grid-template-columns:repeat(3,1fr)}
  .tabs{top:66px}
}
</style>

<!-- ============ ロビー ============ -->
<div id="lobby" class="lb">
  <div style="text-align:center;letter-spacing:.2em;color:var(--acc)">記 録 照 合 フ ェ ー ズ</div>
  <div class="hint" style="text-align:center">DEMO — 5端末用</div>
  <div id="lbErr"></div>
  <input id="code" placeholder="部屋コード（英数4文字）" maxlength="8" autocapitalize="characters">
  <button id="bJoin" class="pri">この部屋に入る／作る</button>
  <div id="seatBox" class="hide">
    <h2>席を選ぶ</h2>
    <div class="seats" id="seats"></div>
  </div>
  <div class="hint">同じ部屋コードを5人で入力してください。席は先着順です。</div>
</div>

<!-- ============ ゲーム ============ -->
<div id="game" class="hide">
  <div class="hd">
    <div class="hd1">
      <span id="rc"></span>
      <span>ROUND <b id="rd">1</b></span>
      <span id="stg"></span>
      <span>残り <b id="dk">0</b>組</span>
      <span>成立 <b id="pr">0</b>/25</span>
    </div>
    <div class="hd2">
      <span class="pill" id="ph">待機</span>
      <span class="hint" id="whose"></span>
      <span class="tm" id="tm">--</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="hand">手札<span class="n" id="nHand"></span></div>
      <div class="tab" data-tab="table">場<span class="n" id="nTbl"></span></div>
      <div class="tab" data-tab="info">情報<span class="n" id="nInf"></span></div>
    </div>
  </div>

  <div id="cue"></div>
  <div id="msg"></div>
  <div id="offers"></div>
  <div id="inq"></div>
  <div id="ask"></div>

  <div class="pane" id="pHand"><div class="hand" id="hand"></div></div>
  <div class="pane hide" id="pTable"><div id="pcs"></div></div>
  <div class="pane hide" id="pInfo">
    <div class="log" id="inf"></div>
    <h2>進行ログ</h2>
    <div class="log" id="lg"></div>
  </div>

  <div class="bot" id="bot"></div>
</div>

<!-- ?v= はキャッシュ避け。cards.js を更新したら数字を1つ増やすこと -->
<script src="cards.js?v=6"></script>
<script src="firebase-config.js?v=6"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = i => document.getElementById(i);
const R = n => Math.floor(Math.random()*n);
const sh = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v=>v!=null) : Object.values(x);

let db, roomRef, S=null, mySeat=null, code=null, sel=[], localMode=null, tick=null;
const SOLO = new URLSearchParams(location.search).has("solo");

// 自分の端末にだけ出す一時メッセージ（DBに書かないので他人には見えない）
let flash = null;
function setFlash(html){
  flash = html;
  setTimeout(() => { if (flash === html) { flash = null; render(); } }, 8000);
}

// ---------- 起動 ----------
function lbErr(html){ $("lbErr").innerHTML = `<div class="msg w">${html}</div>`; }
try {
  if (typeof STAGES === "undefined" || typeof PAIR === "undefined")
    throw new Error("cards.js が古いか、読み込めていません。ページを再読み込み（キャッシュ削除）してください。");
  if (typeof FIREBASE_CONFIG === "undefined" || String(FIREBASE_CONFIG.databaseURL).includes("ここに貼る"))
    throw new Error("firebase-config.js が未設定です。README の手順で設定を貼り付けてください。");
  db = getDatabase(initializeApp(FIREBASE_CONFIG));
} catch(e) {
  lbErr(e.message || "初期化に失敗しました。");
  $("bJoin").disabled = true;
}

$("bJoin").onclick = async () => {
  const c = $("code").value.trim().toUpperCase();
  if (c.length < 2) return;
  try {
  code = c; roomRef = ref(db, "rooms/"+code);
  const snap = await get(roomRef);
  // 旧仕様のデータが残っている部屋は作り直す（deck があるのは旧版）
  if (snap.exists() && (snap.val().stage === undefined || snap.val().deck !== undefined)){
    await set(roomRef, fresh());
  } else if (!snap.exists()) await set(roomRef, fresh());
  onValue(roomRef, s => { S = s.val(); render(); });
  if (SOLO){ // 1台で全席を動かす
    await update(roomRef, { seats:{0:"solo",1:"solo",2:"solo",3:"solo",4:"solo"}, host:0 });
    mySeat = 0; render(); return;
  }
  $("seatBox").classList.remove("hide");
  } catch(e){ lbErr("接続に失敗しました：" + (e.message||e)); }
};
// 部屋をまっさらに戻す
window.resetRoom = async () => {
  if (!roomRef) return;
  if (!confirm("この部屋を最初から作り直します。全員の進行が消えます。よろしいですか？")) return;
  await set(roomRef, fresh());
  mySeat = null; sel = []; lastTurnKey = null;
  $("game").classList.add("hide"); $("lobby").classList.remove("hide");
  lbErr("部屋をリセットしました。もう一度、席を選んでください。");
};

// その段階のカードを5人へ配り切る（山札は残さない）
// 枚数の少ない人から順に配るので、全員が必ず同じ枚数になる（差が出ても最大1枚）
function dealStage(n, ps){
  const st = STAGES[n];
  const pool = sh([...st.pairs, ...st.eff]);
  while (pool.length){
    let mi = 0;
    for (let i = 1; i < 5; i++) if (ps[i].hand.length < ps[mi].hand.length) mi = i;
    ps[mi].hand.push(pool.shift());
  }
}
function fresh(){
  const ps = [0,1,2,3,4].map(()=>({ hand:[], info:[], dice:0, ovr:false }));
  dealStage(0, ps);
  return {
    phase:"lobby", stage:0, round:1, pairs:0, ti:0, endAt:0, host:null,
    order:[0,1,2,3,4], named:[], seats:{}, pend:null, offers:{}, inq:{}, reveal:null,
    msg:"全員が席に着いたら、PC1の端末で「開始」を押してください。", logs:[], ps
  };
}
// 現在の段階で、まだ揃っていない対応の数
const pairsLeft = ps => ps.reduce((n,p)=> n + arr(p.hand).filter(c=>PAIR[c]).length, 0) / 2;
const P5 = ["PC1","PC2","PC3","PC4","PC5"];
const me = () => S.ps[mySeat];
const wr = o => update(roomRef, o);
function push(o, t, cls){ o.logs = [ {t, c:cls||""}, ...(o.logs || arr(S.logs)) ].slice(0,40); }

// ---------- 自動照合 ----------
// 手札に記憶記録と事件記録の対応が揃った瞬間、自動で情報データへ落とし込む。
// 補充によって新たな対応が生まれることがあるので、揃わなくなるまで繰り返す。
function resolvePairs(ps, _unused, o){
  const souls = [], evts = [];
  let again = true, guard = 0;
  o.pairs = (o.pairs !== undefined) ? o.pairs : (S.pairs || 0);
  while (again && guard++ < 40){
    again = false;
    for (let s = 0; s < 5 && !again; s++){
      for (const c of [...ps[s].hand]){
        const m = PAIR[c];
        if (!m || !ps[s].hand.includes(c) || !ps[s].hand.includes(m)) continue;
        ps[s].hand = ps[s].hand.filter(z => z !== c && z !== m);   // 補充は無い。手札は減る
        const memId = (C[c].t === "mem") ? c : m;
        ps[s].info = [...ps[s].info, { t: INFO[c], f: "自分", src: memId }];
        const owner = C[c].o, os = P5.indexOf(owner);
        const strong = (os === s);
        souls.push({ to: os, strong, by: s });
        evts.push({ by:s, info:INFO[c], a:c, m });
        // 魂の記憶：当事者にだけ、共有できない記憶としてストックする
        if (SOUL[memId]) putSoul(ps[os], memId, strong);
        o.pairs++;
        push(o, `<b>${P5[s]}</b> の手元で1組が成立（${c}＋${m}）`, "me");
        again = true; break;
      }
    }
  }
  if (souls.length) o.souls = { at: Date.now(), list: souls };
  if (evts.length){
    o.pairEvt = { at: Date.now(), list: evts };
    o.msg = evts.map(e=>`◆ <b>${P5[e.by]}</b> の手元で1組が成立しました（${e.a}＋${e.m}）`).join("<br>")
          + `<br><span class="hint">内容が読めるのは、成立させた本人だけです</span>`;
    o.msgC = "s";
  }
  // その段階の対応が全て揃ったら、次の段階へ
  if (pairsLeft(ps) === 0) advanceStage(ps, o);
  return souls;
}
// 段階の進行
function advanceStage(ps, o){
  const cur = (o.stage !== undefined) ? o.stage : (S.stage || 0);
  if (cur >= STAGES.length - 1){ finish(o); return; }
  const next = cur + 1;
  // 持ち越しなし。使わなかった効果カードは破棄される
  const dropped = ps.reduce((n,p)=> n + p.hand.length, 0);
  ps.forEach(p => { p.hand = []; });
  dealStage(next, ps);
  const fmap = {};
  ps.forEach((p,i)=>{ fmap[i] = [...p.hand]; });
  mergeFresh(o, fmap);
  o.stage = next;
  o.phase = "wait"; o.pend = null; o.endAt = 0;
  o.offers = {}; o.inq = {}; o.reveal = null;
  o.msg = `<b>${STAGES[cur].name} 完了。</b>記録が全て復元されました。<br>`
        + (dropped ? `未使用の補助プログラム ${dropped}件は破棄されました。<br>` : "")
        + `続いて <b>${STAGES[next].name}「${STAGES[next].sub}」</b> の記録が配布されます。`;
  o.msgC = "s";
  push(o, `<b>${STAGES[cur].name} 完了</b> → ${STAGES[next].name} へ`, "me");
}
// 魂の記憶を積む。既に弱い記憶があり、今回が強い記憶なら上書きする。
// 戻り値：新しく蘇った／完全な形になった場合 true
function putSoul(p, memId, strong){
  const i = p.info.findIndex(x => x.soul && x.src === memId);
  if (i >= 0){
    if (!p.info[i].weak || !strong) return false;   // 既に完全、または今回も弱い
    p.info = p.info.map((x,k)=> k===i
      ? { t: SOUL[memId], f:"—", soul:true, weak:false, src:memId } : x);
    return true;
  }
  p.info = [...p.info, {
    t: strong ? SOUL[memId] : soulWeak(SOUL[memId]),
    f:"—", soul:true, weak:!strong, src:memId
  }];
  return strong;
}

// 直前に手札へ入ったカード（NEW表示用）
function mergeFresh(o, map){
  if (!Object.keys(map).length) return;
  const cur = (o.fresh && o.fresh.map) ? o.fresh.map : {};
  Object.entries(map).forEach(([k,v]) => { cur[k] = [...(cur[k]||[]), ...v]; });
  o.fresh = { at: Date.now(), map: cur };
}
// ps / deck を安全に取り出すヘルパ
const clonePs = () => S.ps.map(x => ({ ...x, hand: arr(x.hand), info: arr(x.info) }));

// ---------- 描画 ----------
let lastTurnKey = null;
function render(){
  if (!S) return;
  // ソロ確認モードでは、手番が変わったら自動でその席に切り替える（手動切替も可）
  if (SOLO && mySeat!==null && S.phase==="draw" && S.pend){
    const k = S.round+"-"+S.ti;
    if (k !== lastTurnKey){ lastTurnKey = k; mySeat = S.pend.by; sel = []; }
  }
  // 席選択
  $("seats").innerHTML = P5.map((n,i)=>{
    const taken = S.seats && S.seats[i];
    // 埋まっている席も押せる（前の端末が離脱したときに入り直せるように）
    return `<button data-seat="${i}" class="${i===mySeat?"pri":""}">${n}${taken&&i!==mySeat?" ●使用中":""}</button>`;
  }).join("") + `<button onclick="resetRoom()" class="dgr" style="grid-column:1/-1;margin-top:6px">この部屋を最初から作り直す</button>`;
  $("seats").querySelectorAll("[data-seat]").forEach(b => b.onclick = () => {
    const i = +b.dataset.seat;
    if (S.seats && S.seats[i] && i !== mySeat &&
        !confirm(`${P5[i]} は使用中です。この席を引き継ぎますか？`)) return;
    takeSeat(i);
  });
  if (mySeat===null) return;

  $("lobby").classList.add("hide"); $("game").classList.remove("hide");
  renderSolo();

  // --- 自分の状況を先に確定させる ---
  const pend = S.pend;
  const myTurn = pend && pend.by===mySeat && S.phase==="draw";
  localMode = myTurn ? pend.stage : null;
  const turn = S.phase==="draw" ? arr(S.order)[S.ti] : -1;

  // フェーズ色（交渉＝シアン／引き＝オレンジ）
  document.documentElement.style.setProperty("--phase",
    S.phase==="draw" ? "var(--wrn)" : "var(--acc)");

  // --- ヘッダ ---
  $("rc").innerHTML = `<b>${code}</b>・${P5[mySeat]}${SOLO?" <span class='hint'>SOLO</span>":""}`;
  $("rd").textContent = S.round; $("dk").textContent = pairsLeft(S.ps);
  $("stg").innerHTML = STAGES[S.stage||0].name;
  $("pr").textContent = S.pairs;
  $("ph").textContent = {lobby:"待機中",nego:"交渉ターン",draw:"引きターン",wait:"ラウンド間",over:"終了"}[S.phase]||"";
  $("whose").textContent = S.phase==="draw" && turn>=0 ? `${P5[turn]} の手番` : "";

  // --- やることバナー ---
  const cue = {
    target:["① 引く相手を選ぶ","「場」タブで <b>▶ ◯◯ から引く</b> を押してください。<br>薄くなっている個体は、このラウンドで既に指名済みです。"],
    steal : ["② 引く1枚を選ぶ",`<b>${pend&&pend.from!=null?P5[pend.from]:""}</b> の手札から1枚タップ。<br><b>中身は見えません。</b>交渉で聞き出した内容を信じるかどうかです。`],
  }[localMode];
  $("cue").innerHTML = cue
    ? `<div class="cue turn"><span class="big">${cue[0]}</span>${cue[1]}</div>`
    : S.phase==="nego"
      ? `<div class="cue"><span class="big">交渉ターン</span>
          手札を1枚タップ → <b>「照会」</b>で全員に見せ、対応する半券を探します。<br>
          交換は1対1。情報データは何件でも渡せます。<b>約束を守る義務はありません。</b></div>`
      : S.phase==="draw"
      ? `<div class="cue"><span class="big">${P5[turn]} の手番</span>待っています。対応が揃えば自動で照合されます。</div>`
      : S.phase==="wait"
      ? `<div class="cue"><span class="big">${STAGES[S.stage||0].name}「${STAGES[S.stage||0].sub}」</span>
          記録が配布されました。ホストが「次のラウンドへ」を押すと始まります。</div>`
      : S.phase==="over"
      ? `<div class="cue"><span class="big">終了</span>全ての記録が復元されました。</div>` : "";
  $("msg").innerHTML =
    (flash ? `<div class="msg s">${flash}<br><span class="hint">この表示はあなたにしか出ていません</span></div>` : "") +
    (S.msg ? `<div class="msg ${S.msgC||""}">${S.msg}</div>` : "");

  // --- 場（他の個体）：手札の中身は一切見えない。位置だけが見える ---
  $("pcs").innerHTML = P5.map((n,i)=>{
    if (i===mySeat) return "";
    const isSteal = localMode==="steal" && pend && pend.from===i;
    if (localMode==="steal" && !isSteal) return "";   // 引く相手だけに絞る
    const p = S.ps[i], hand = arr(p.hand);
    const named = arr(S.named).includes(i);
    const isTgt = localMode==="target" && !named && hand.length>0;
    const rv = S.reveal && S.reveal.to===mySeat && S.reveal.of===i ? arr(S.reveal.cards) : [];
    return `<div class="pc ${turn===i?"act":""} ${named&&S.phase==="draw"?"nmd":""} ${isTgt||isSteal?"tgt":""}">
      <div class="pt">
        <span class="nm">${n}</span>
        ${turn===i?'<span class="now">手番</span>':""}
        <span class="d">${p.dice||""}</span>
      </div>
      <div class="pm">手札 ${hand.length}枚 ／ 情報 ${arr(p.info).length}件${p.ovr?" ／ 優先":""}${named&&S.phase==="draw"?" ／ 指名済み":""}</div>
      ${isTgt?`<button class="pickbtn" data-t="${i}">▶ ${n} から引く</button>`:""}
      ${isSteal?`<div class="stealhint">引く1枚をタップ（中身は分かりません）</div>`:""}
      <div class="slots">${hand.map((c,k)=>
        rv.includes(c)
          ? `<div class="slot rv ${isSteal?"tap":""}" ${isSteal?`data-c="${c}"`:""}>${c}</div>`
          : `<div class="slot ${isSteal?"tap":""}" ${isSteal?`data-c="${c}"`:""}>${k+1}</div>`
      ).join("")}</div>
      ${rv.map(c=>`<div class="mn"><span class="mid">${c}　閲覧済み</span>${C[c].x}</div>`).join("")}
    </div>`;
  }).join("");
  $("pcs").querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>pickTarget(+e.dataset.t));
  $("pcs").querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>pickCard(e.dataset.c));

  // --- 自分の手札 ---
  const hand = arr(me().hand);
  const freshIds = (S.fresh && S.fresh.map) ? arr(S.fresh.map[mySeat]) : [];
  $("hand").innerHTML = hand.map(c=>{
    const d = C[c], own = d.t==="mem" && d.o===P5[mySeat];
    const k = {rec:"事件記録",mem:"記憶記録",eff:`${d.ph==="nego"?"交渉":"引き"}／${d.n}`,jok:"事後通信"}[d.t];
    const on = sel.includes(c), isNew = freshIds.includes(c);
    return `<div class="cd c${d.t} ${on?"sel":""} ${own?"own":""} ${isNew?"new":""}" data-h="${c}">
      ${on?'<span class="selno">✓</span>':""}
      ${isNew?'<span class="newtag">NEW</span>':""}
      ${own?'<span class="tg">◆ 自分</span>':""}
      <div class="ci">${c}</div><div class="ck">${k}</div><div class="ct">${d.x}</div></div>`;
  }).join("");
  $("hand").querySelectorAll("[data-h]").forEach(e=>e.onclick=()=>tapHand(e.dataset.h));

  // --- 情報・ログ ---
  const info = arr(me().info);
  $("inf").innerHTML = info.length
    ? info.map((x,i)=> x.soul
      ? `<div class="ie soul ${x.weak?"weak":""}">
          <div class="sl">${x.weak?"◆ 弱い記憶（音だけが、遠くで）":"◆ 蘇った記憶"}</div>
          <div class="it">${x.t}</div>
          <div class="ir"><span class="hint">これは渡せません。口で伝えるしかない。</span></div>
        </div>`
      : `<div class="ie ${x.f==="自分"?"me":""}">
          <div class="it">${x.t}</div>
          <div class="ir"><span class="hint">入手：${x.f}</span>
            <button class="shb" onclick="toggleShare(${i})">${shareOpen===i?"閉じる":"渡す"}</button></div>
          ${shareOpen===i ? `<div class="tgts">${
              P5.map((n,j)=> j===mySeat ? "" : `<button data-send="${i}:${j}">${n}</button>`).join("")
            }<button data-send="${i}:all" class="dgr">全員</button></div>` : ""}
        </div>`).join("")
    : '<div class="hint">まだ情報がありません。手札に対応が揃うと自動で溜まります。</div>';
  $("inf").querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>{
    const [i,to] = b.dataset.send.split(":"); sendInfo(Number(i), to);
  });
  $("lg").innerHTML = arr(S.logs).map(l=>`<div class="${l.c}">${l.t}</div>`).join("");

  // --- タブ ---
  $("nHand").textContent = hand.length;
  $("nTbl").textContent = "";
  $("nInf").textContent = info.length || "";
  if (localMode==="target" || localMode==="steal") tab = "table";
  else if (localMode==="give") tab = "hand";
  showTab(tab);

  renderOffers(); renderInq(); renderAsk(); renderBottom(); startTick();
}

// ---------- タブ ----------
let tab = "hand";
function showTab(t){
  tab = t;
  const map = { hand:"pHand", table:"pTable", info:"pInfo" };
  Object.entries(map).forEach(([k,id]) => $(id).classList.toggle("hide", k!==t));
  document.querySelectorAll(".tab").forEach(e => e.classList.toggle("on", e.dataset.tab===t));
}
document.querySelectorAll(".tab").forEach(e => e.onclick = () => showTab(e.dataset.tab));

// ---------- 席 ----------
async function takeSeat(i){
  await runTransaction(roomRef, s => {
    if (!s) return s;
    s.seats = s.seats || {};
    Object.keys(s.seats).forEach(k => { if (s.seats[k]===myId()) delete s.seats[k]; });
    s.seats[i] = myId();   // 使用中でも引き継ぐ（確認は呼び出し側で済ませている）
    if (s.host === null || s.host === undefined) s.host = i;
    return s;
  });
  mySeat = i; sel = []; render();
}
// sessionStorage はタブごとに独立するので、1台で複数タブを開けば別プレイヤーとして扱える
function myId(){ let v = sessionStorage.getItem("uzuid"); if(!v){ v = Math.random().toString(36).slice(2,10); sessionStorage.setItem("uzuid", v);} return v; }
const isHost = () => SOLO || (S && S.host === mySeat);

// ---------- ソロ確認モード（?solo=1）----------
function renderSolo(){
  if (!SOLO || mySeat===null) return;
  let bar = document.getElementById("solobar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "solobar";
    bar.style.cssText = "display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 12px 0";
    $("game").insertBefore(bar, $("cue"));
  }
  bar.innerHTML = P5.map((n,i)=>
    `<button data-s="${i}" class="${i===mySeat?"pri":""}" style="padding:9px 2px;font-size:13px;border-radius:6px">${n}</button>`).join("");
  bar.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ mySeat=+b.dataset.s; sel=[]; render(); });
}

// ---------- タイマー ----------
function startTick(){
  if (tick) return;
  tick = setInterval(() => {
    if (!S || !S.endAt) { $("tm").textContent="--"; $("tm").className="tm"; return; }
    const s = Math.max(0, Math.ceil((S.endAt - Date.now())/1000));
    $("tm").textContent = s; $("tm").className = "tm" + (s<=5?" hot":"");
    if (s===0 && isHost()) onTimeout();
  }, 300);
}

// ---------- 進行 ----------
function beginRound(){
  const o = {}; const ps = S.ps.map(p=>({...p, dice:R(6)+1}));
  const order = [0,1,2,3,4].sort((a,b)=>(ps[b].ovr?100:0)-(ps[a].ovr?100:0) || ps[b].dice-ps[a].dice);
  ps.forEach(p=>{ p.ovr=false; p.hand=arr(p.hand); p.info=arr(p.info); });
  o.ps=ps; o.order=order; o.named=[]; o.ti=0; o.phase="nego"; o.pend=null;
  o.offers={}; o.inq={}; o.reveal=null; o.fresh=null;   // NEW表示はラウンドごとにリセット
  resolvePairs(ps, null, o);   // 初回配布や効果カードで既に揃っている場合の取りこぼしを拾う
  o.endAt = Date.now()+60000;
  o.msg = ""; o.msgC = "";   // 説明は指示バナー（cue）が出すので、msg はイベント通知専用
  push(o, `<b>R${S.round}</b> 抽選 → ` + order.map(i=>P5[i]+"("+ps[i].dice+")").join(" ／ "));
  wr(o);
}
function toDraw(){
  const o = { phase:"draw", ti:0, offers:{}, reveal:null };
  beginTurnInto(o, 0); wr(o);
}
function beginTurnInto(o, ti){
  const seat = arr(S.order)[ti];
  o.ti = ti; o.pend = { by:seat, stage:"target" };
  o.endAt = Date.now()+20000;
  o.msg = ""; o.msgC = "";   // 手番の案内は指示バナー（cue）が出す
}
function endTurn(o){
  if (o.phase === "over") return;   // 自動照合で25組に達していたら終了を優先
  const ti = S.ti + 1;
  if (ti >= 5) {
    if ((o.pairs ?? S.pairs) >= 25) return finish(o);
    o.round = S.round + 1; o.phase = "nego"; o.pend = null; o.endAt = 0;
    o.msg = "ラウンド終了。ホストが「次のラウンド」を押してください。"; o.msgC = "";
    // 次ラウンドの抽選は beginRound で行う
    o.phase = "wait";
  } else beginTurnInto(o, ti);
}
function finish(o){
  o.phase="over"; o.endAt=0; o.pend=null;
  const psx = o.ps || S.ps;
  const n = (o.pairs!==undefined) ? o.pairs : S.pairs;
  const jk = psx.findIndex(p => arr(p.hand).includes("X-01"));
  o.msg = `<b>記録照合フェーズ終了</b>　成立 ${n}/25 組<br>`
        + (jk >= 0
            ? `全ての記録が復元されました。それでも <b>${P5[jk]}</b> の手元に、対応の無い1件が残っています。`
            : `全ての記録が復元されました。`);
  o.msgC = "s";
}
function onTimeout(){
  const o = {};
  if (S.phase==="nego"){ o.phase="draw"; beginTurnInto(o,0); push(o,"交渉ターン終了"); wr(o); return; }
  if (S.phase==="draw" && S.pend) autoResolve();
}

// ---------- 引きターン ----------
function pickTarget(i){
  if (!S.pend || S.pend.stage!=="target" || S.pend.by!==mySeat) return;
  if (arr(S.named).includes(i)) return;
  if (!arr(S.ps[i].hand).length) return;   // 手札が無い個体からは引けない
  const o = { named:[...arr(S.named), i], pend:{...S.pend, from:i, stage:"steal"}, endAt: Date.now()+20000 };
  o.msg = `<b>${P5[mySeat]}</b> が ${P5[i]} を指名。引く1枚を選択中…`;
  localMode = null; wr(o);
}
function pickCard(c){
  const p = S.pend;
  if (!p || p.stage!=="steal" || p.by!==mySeat) return;
  const ps = clonePs();
  ps[p.from].hand = ps[p.from].hand.filter(z=>z!==c);
  ps[p.by].hand = [...ps[p.by].hand, c];
  // 渡す動作は無い。引いたら手番終了。指名が一巡すれば全員5枚へ戻る
  const o = { ps };
  push(o, `${P5[p.by]} が ${P5[p.from]} から1枚引いた`);
  const kind = {rec:"事件記録",mem:"記憶記録",eff:"効果カード",jok:"事後通信"}[C[c].t];
  setFlash(`<b>${P5[p.from]} から引いた1枚</b><br>${c}（${kind}）<br>${C[c].x}`);
  mergeFresh(o, { [p.by]: [c] });
  resolvePairs(ps, null, o);
  tab = "hand";
  endTurn(o); sel=[]; localMode=null; wr(o);
}
function skipTurn(){
  const p = S.pend, o = {};
  o.msg = `${P5[p.by]}：指名できる相手が残っていないため、このラウンドは引けません。`; o.msgC="w";
  push(o, `${P5[p.by]} は指名先が無く、引けなかった`);
  endTurn(o); wr(o);
}
function autoResolve(){
  const p = S.pend; if (!p) return;
  if (p.stage==="target"){
    const av = [0,1,2,3,4].filter(i=>i!==p.by && !arr(S.named).includes(i) && arr(S.ps[i].hand).length);
    if (!av.length) return skipTurn();
    const i = av[R(av.length)];
    const o = { named:[...arr(S.named), i], pend:{...p, from:i, stage:"steal"}, endAt: Date.now()+20000 };
    push(o, `<span style="color:var(--wrn)">自動処理</span> ${P5[p.by]} → ${P5[i]} を指名`);
    o.msg = "応答なし。優先度に従い、自動処理します。"; o.msgC="w"; wr(o); return;
  }
  if (p.stage==="steal"){
    const h = arr(S.ps[p.from].hand);
    if (!h.length) return skipTurn();
    const ps = clonePs();
    const c = h[R(h.length)];
    ps[p.from].hand = ps[p.from].hand.filter(z=>z!==c);
    ps[p.by].hand = [...ps[p.by].hand, c];
    const o = { ps };
    push(o, `<span style="color:var(--wrn)">自動処理</span> ${P5[p.by]} がランダムに1枚引いた`);
    o.msg="応答なし。優先度に従い、自動処理しました。"; o.msgC="w";
    resolvePairs(ps, null, o);
    endTurn(o); wr(o);
  }
}

// ---------- 手札タップ ----------
// 照合は自動なので、選択は「効果カードを使う」「交換に出す」用の1枚だけ
function tapHand(c){
  sel = sel.includes(c) ? [] : [c];
  render();
}

// ---------- 効果カード ----------
function useEffect(){
  const id = sel[0], d = C[id];
  if (!confirm(`【${d.n}】\n${d.x}\n\n使用しますか？`)) return;
  if (d.n==="優先アクセス権" || d.n==="完全アクセス権" || d.n==="強制照合"){
    chooseTarget(`<b>${d.n}</b>：どの個体を対象にしますか？`, ti => applyEffect(id, ti));
    return;
  }
  applyEffect(id, null);
}
function applyEffect(id, ti){
  const d = C[id];
  const ps = clonePs();
  ps[mySeat].hand = ps[mySeat].hand.filter(c=>c!==id);
  const o = { ps };
  if (d.n==="優先度上書き") ps[mySeat].ovr = true;
  if (d.n==="全体再構成"){
    let pool = sh(ps.flatMap(x=>x.hand)); ps.forEach(x=>x.hand=[]);
    let i=0; while(pool.length){ ps[i%5].hand.push(pool.shift()); i++; }
    push(o, "<b>全体再構成</b>：全手札を回収し再配分");
  }
  if (d.n==="記録監査"){
    const mv = ps.map(x=>{ const r=x.hand.filter(c=>C[c].t==="rec"); return r.length?r[R(r.length)]:null; });
    mv.forEach((c,i)=>{ if(!c) return; ps[i].hand=ps[i].hand.filter(z=>z!==c); ps[(i+4)%5].hand.push(c); });
    push(o, "<b>記録監査</b>：全員が事件記録を1件ずつ左隣へ");
  }
  if ((d.n==="優先アクセス権" || d.n==="完全アクセス権") && ti!=null){
    const h = arr(ps[ti].hand);
    const cards = d.n==="完全アクセス権" ? h : (h.length ? [h[R(h.length)]] : []);
    o.reveal = { to:mySeat, of:ti, cards, at:Date.now() };
    push(o, `${P5[mySeat]} が ${P5[ti]} に <b>${d.n}</b> を使用`);
    setFlash(`<b>${d.n}</b>：${P5[ti]} の手札を閲覧しました。<br>「場」タブに内容が出ています。`);
    tab = "table";
  }
  if (d.n==="強制照合" && ti!=null){
    o.named = [...arr(S.named), ti];
    o.pend = { by:mySeat, from:ti, stage:"steal", forced:true };
    o.msg = `<b>強制照合</b>：${P5[mySeat]} が ${P5[ti]} から強制的に1枚引きます。`; o.msgC="w";
    push(o, `${P5[mySeat]} が ${P5[ti]} へ <b>強制照合</b> を使用`);
  }
  if (["相互置換","開示制御"].includes(d.n)){
    o.msg = `<b>${P5[mySeat]}</b> が <b>${d.n}</b> を使用しました。効果は口頭で合意のうえ、交渉ターンの交換機能で処理してください。`; o.msgC="w";
    push(o, `${P5[mySeat]} が <b>${d.n}</b> を使用（手動処理）`);
  }
  resolvePairs(ps, null, o);
  sel=[]; wr(o);
}

// ---------- 照会（手札を1枚だけ全体公開して、対応を探す）----------
// 全員に見せる＝照会 ／ 1人だけに見せる＝個別開示
function showCard(){
  const c = sel[0]; if (!c) return;
  chooseTarget(`<b>${c}</b> を誰に見せますか？<br><span class="hint">全員＝照会（対応が見つかりやすい）／1人＝密かに交渉できる</span>`,
    v => {
      const u = {};
      if (v === "all"){
        u["inq/i"+Date.now()] = { by:mySeat, card:c, all:true };
        push(u, `${P5[mySeat]} が <b>${c}</b> を全員へ照会した`);
      } else {
        u["inq/i"+Date.now()] = { by:mySeat, card:c, to:v };
        push(u, `${P5[mySeat]} が ${P5[v]} へ1枚だけ見せた`);
      }
      sel = []; wr(u);
    }, true);
}
function renderInq(){
  // 全体照会は全員に、個別開示は当事者2人にだけ見せる
  const list = Object.entries(S.inq || {})
    .filter(([,q]) => q.all || q.to === mySeat || q.by === mySeat);
  if (!list.length){ $("inq").innerHTML = ""; return; }
  $("inq").innerHTML = list.map(([id,q])=>{
    const d = C[q.card];
    const kind = {rec:"事件記録",mem:"記憶記録",eff:"効果カード",jok:"事後通信"}[d.t];
    const mine = q.by === mySeat;
    const head = q.all
      ? `${P5[q.by]} の照会（全員）`
      : (mine ? `${P5[q.to]} だけに見せています` : `${P5[q.by]} があなただけに見せた`);
    return `<div class="inq ${q.all?"":"priv"}">
      <div class="ih">${head}　<span class="hint">${q.card}／${kind}</span></div>
      <div class="ib">${d.x}</div>
      ${mine
        ? `<button data-x="${id}" class="dgr">取り下げる</button>`
        : `<button data-r="${id}" ${sel.length===1?"":"disabled"}>${sel.length===1?`${sel[0]} を渡すと申し出る`:"応じる（手札を1枚選ぶ）"}</button>`}
    </div>`;
  }).join("");
  $("inq").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>respondInq(b.dataset.r));
  $("inq").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>wr({["inq/"+b.dataset.x]:null}));
}
function respondInq(id){
  const q = S.inq[id]; if (!q || sel.length!==1) return;
  const u = { ["offers/o"+Date.now()]: { from:mySeat, to:q.by, card:sel[0] } };
  push(u, `${P5[mySeat]} が ${P5[q.by]} の${q.all?"照会":"開示"}に応じた`);
  sel = []; wr(u);
}

// ---------- 交渉ターンの交換 ----------
function makeOffer(){
  const c = sel[0]; if (!c) return;
  chooseTarget(`<b>${c}</b> を、どの個体と交換しますか？`, ti=>{
    wr({ ["offers/o"+Date.now()]: { from:mySeat, to:ti, card:c } });
    sel=[]; render();
  });
}
function renderOffers(){
  const os = S.offers || {};
  const mine = Object.entries(os).filter(([,o])=>o.to===mySeat);
  $("offers").innerHTML = mine.map(([id,o])=>
    `<div class="msg w"><b>${P5[o.from]}</b> から交換の申請（相手が出す：${o.card}）<br>
     <span class="hint">自分の手札を1枚選んでから「承認」</span><br>
     <button data-ok="${id}" style="margin-top:6px">承認</button>
     <button data-ng="${id}" class="dgr" style="margin-top:6px">拒否</button></div>`).join("");
  $("offers").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>acceptOffer(b.dataset.ok));
  $("offers").querySelectorAll("[data-ng]").forEach(b=>b.onclick=()=>wr({["offers/"+b.dataset.ng]:null}));
}
function acceptOffer(id){
  const o = S.offers[id];
  if (sel.length!==1) { alert("自分の手札を1枚選んでください"); return; }
  const ps = clonePs();
  ps[o.from].hand = ps[o.from].hand.filter(c=>c!==o.card).concat(sel[0]);
  ps[mySeat].hand = ps[mySeat].hand.filter(c=>c!==sel[0]).concat(o.card);
  const u = { ps, ["offers/"+id]:null };
  push(u, `${P5[o.from]} ⇄ ${P5[mySeat]} が交換成立`);
  resolvePairs(ps, null, u);
  sel=[]; wr(u);
}
// ---------- 相手を選ぶ（prompt を使わない共通UI）----------
let askTarget = null;
function chooseTarget(label, cb, withAll){ askTarget = { label, cb, all:!!withAll }; render(); }
function renderAsk(){
  if (!askTarget){ $("ask").innerHTML = ""; return; }
  $("ask").innerHTML = `<div class="askbox"><div class="al">${askTarget.label}</div>
    <div class="tgts">
      ${askTarget.all ? `<button data-ask="all" class="pri">全員</button>` : ""}
      ${P5.map((n,j)=> j===mySeat ? "" : `<button data-ask="${j}">${n}</button>`).join("")}
      <button data-ask="x" class="dgr">やめる</button>
    </div></div>`;
  $("ask").querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{
    const v = b.dataset.ask, cb = askTarget.cb;
    askTarget = null;
    if (v === "x") return render();
    cb(v === "all" ? "all" : Number(v));
  });
}

// ---------- 情報データの共有 ----------
let shareOpen = null;   // 「渡す」を開いている情報の番号
window.toggleShare = i => { shareOpen = (shareOpen===i) ? null : i; render(); };
function sendInfo(idx, to){
  const info = arr(me().info)[idx]; if (!info) return;
  if (info.soul){ setFlash("この記憶は渡せません。口で伝えるしかありません。"); return; }
  const targets = (to==="all") ? [0,1,2,3,4].filter(i=>i!==mySeat) : [Number(to)];
  const ps = clonePs();
  const sent = [], revived = [];
  targets.forEach(t=>{
    if (ps[t].info.some(x => !x.soul && x.t === info.t)) return;   // 既に持っていれば入れない
    ps[t].info = [...ps[t].info, { t: info.t, f: P5[mySeat], src: info.src }];
    sent.push(t);
    // 渡した相手が、その出来事の当事者だった場合 ── 記憶が完全な形で蘇る
    if (info.src && SOUL[info.src] && C[info.src].o === P5[t]){
      if (putSoul(ps[t], info.src, true)) revived.push(t);
    }
  });
  const u = { ps };
  if (sent.length){
    u.infoEvt = { at: Date.now(), to: sent, from: mySeat, revived };
    push(u, `${P5[mySeat]} → ${sent.map(t=>P5[t]).join("・")} へ情報データを共有`);
    setFlash(`<b>情報を渡しました</b><br>${sent.map(t=>P5[t]).join("・")} へ`);
  } else {
    setFlash("その情報は、相手が既に持っています。");
  }
  shareOpen = null; wr(u);
}

// ---------- ボトムバー ----------
function renderBottom(){
  const b = [], p = S.pend, myTurn = p && p.by===mySeat && S.phase==="draw";

  // 選択中に出せるものを最優先で
  if (sel.length===1 && C[sel[0]].t==="eff"){
    const ok = (C[sel[0]].ph==="nego" && S.phase==="nego") || (C[sel[0]].ph==="draw" && myTurn);
    b.push([ok?`${C[sel[0]].n} を使う`:"このフェーズでは使えない","pri",ok?useEffect:null]);
  }
  if (S.phase==="lobby" && isHost()) b.push(["開始","pri",()=>beginRound()]);
  if (S.phase==="wait" && isHost()) b.push(["次のラウンドへ","pri",()=>beginRound()]);
  if (S.phase==="nego"){
    b.push([sel.length===1?`${sel[0]} を見せる`:"カードを見せる（1枚選ぶ）","pri",sel.length===1?showCard:null]);
    b.push([sel.length===1?"名指しで交換":"交換（1枚選ぶ）","",sel.length===1?makeOffer:null]);
    b.push([`情報を渡す（${arr(me().info).length}件）`,"",()=>{ showTab("info"); }]);
    if (isHost()) b.push(["交渉終了 →","dgr",()=>toDraw()]);
  }
  if (isHost() && S.phase==="draw") b.push(["自動処理","dgr",autoResolve]);

  $("bot").innerHTML = b.map((x,i)=>`<button data-b="${i}" class="${x[1]}" ${x[2]?"":"disabled"}>${x[0]}</button>`).join("");
  $("bot").querySelectorAll("[data-b]").forEach(e=>{ const f=b[+e.dataset.b][2]; if(f) e.onclick=f; });
  fitBottom();
}
// 下部バーは折り返して高さが変わるので、実測して本文の下余白を合わせる
function fitBottom(){
  requestAnimationFrame(()=>{
    const h = $("bot").offsetHeight || 0;
    document.body.style.paddingBottom = (h + 18) + "px";
  });
}
addEventListener("resize", fitBottom);

// ---------- 魂の記憶の通知 ----------
// 情報を受け取ったとき
let lastInfo = 0;
setInterval(()=>{
  if (!S || !S.infoEvt || mySeat===null) return;
  if (S.infoEvt.at === lastInfo) return;
  lastInfo = S.infoEvt.at;
  if (!arr(S.infoEvt.to).includes(mySeat)) return;
  const woke = arr(S.infoEvt.revived).includes(mySeat);
  setFlash(woke
    ? `<b>${P5[S.infoEvt.from]} から受け取った記録が、記憶を呼び起こした。</b><br>`
      + `途切れていた音の続きが、映像になって戻ってくる。<br>`
      + `<span class="hint">情報タブで、完全な形になった記憶を確認できます。</span>`
    : `<b>${P5[S.infoEvt.from]} から情報データを受け取りました</b><br>情報タブで確認できます。`);
  showTab("info");
  if (navigator.vibrate) navigator.vibrate(woke ? [90,60,90,60,140] : 50);
}, 400);

// ペア成立：成立させた本人にだけ、得た情報の中身を出す
let lastPair = 0;
setInterval(()=>{
  if (!S || !S.pairEvt || mySeat===null) return;
  if (S.pairEvt.at === lastPair) return;
  lastPair = S.pairEvt.at;
  const mine = arr(S.pairEvt.list).filter(e => e.by === mySeat);
  if (!mine.length) return;
  setFlash(`<b>照合が成立しました（${mine.length}組）</b><br>`
    + mine.map(e=>`${e.a}＋${e.m}<br>▶ ${e.info}`).join("<br><br>")
    + `<br><br><span class="hint">情報タブに保存されました。山札から${mine.reduce((s,e)=>s+e.got,0)}枚補充されています。</span>`);
  tab = "hand";
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
}, 400);

let lastSoul = 0;
setInterval(()=>{
  if (!S || !S.souls || mySeat===null) return;
  if (S.souls.at === lastSoul) return;
  lastSoul = S.souls.at;
  const mine = arr(S.souls.list).filter(x => x.to === mySeat);
  if (!mine.length) return;
  const strong = mine.some(x => x.strong);
  const t = strong
    ? "◆ 強い記憶が蘇った。映像と音が、はっきりと戻ってくる。"
    : "◆ 弱い記憶。音だけが、遠くで鳴っている。";
  $("msg").innerHTML = `<div class="msg s">${t}${mine.length>1?`<br>（${mine.length}件）`:""}
    <br><span class="hint">この表示はあなたにしか出ていません</span></div>`;
  if (navigator.vibrate) navigator.vibrate(strong?[80,60,80]:[40]);
}, 500);
</script>

<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記録照合フェーズ — DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c0e; --pan:#151a1e; --pan2:#1c232a; --ln:#2b333b;
  --fg:#e4ebf0; --dim:#7d8892; --acc:#5fd3c8; --wrn:#ff7a45; --glw:#ffd166;
  --phase:var(--acc);
}
html,body{background:var(--bg);color:var(--fg);
  font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body{max-width:820px;margin:0 auto;padding:0 0 84px}
button{font-family:inherit;font-size:15px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px 14px;cursor:pointer;border-radius:6px;
  transition:transform .06s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.28}
button.pri{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
button.dgr{border-color:var(--wrn);color:var(--wrn)}
input{font-family:inherit;font-size:17px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px;width:100%;border-radius:6px}
.hide{display:none !important}
.hint{font-size:12px;color:var(--dim)}

/* ---------- ロビー ---------- */
.lb{max-width:400px;margin:44px auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* ---------- ヘッダ ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:2px solid var(--phase);padding:8px 0 9px}
.hd1,.hd2{padding:0 12px}
.pane{padding-top:10px}
.hd1{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim)}
.hd1 b{color:var(--fg);letter-spacing:.06em}
.hd2{display:flex;align-items:center;gap:12px;margin-top:2px}
.pill{font-size:13px;letter-spacing:.16em;color:#06110f;background:var(--phase);
  padding:3px 12px;border-radius:20px;font-weight:700}
.tm{font-size:30px;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums;
  color:var(--phase)}
.tm.hot{color:var(--wrn);animation:bl .8s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}

/* ---------- 指示バナー ---------- */
.cue{margin:10px 12px 0;padding:12px 14px;border-radius:8px;font-size:15px;
  background:var(--pan);border:1px solid var(--phase);line-height:1.6}
.cue.turn{background:rgba(255,122,69,.14);border-color:var(--wrn);border-width:2px}
.cue b{color:var(--fg)}
.cue .big{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.msg{margin:8px 12px 0;padding:10px 13px;border-radius:8px;font-size:14px;
  background:var(--pan);border:1px solid var(--ln)}
.msg.w{border-color:var(--wrn);color:#ffc7ad}
.msg.s{border-color:var(--glw);color:var(--glw);background:rgba(255,209,102,.08)}

/* ---------- タブ ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;background:var(--bg);padding:9px 12px 0}
.tab{padding:11px 4px;border-radius:8px;background:var(--pan);border:1px solid var(--ln);
  text-align:center;font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
.tab .n{font-size:11px;opacity:.7;margin-left:3px}
.pane{padding:0 12px}

/* ---------- 自分の手札 ---------- */
.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cd{border:1px solid var(--ln);background:var(--pan);border-radius:8px;padding:11px;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;
  min-height:150px}
.cd.sel{border-color:var(--acc);background:#16262a;box-shadow:0 0 0 2px var(--acc)}
.cd.own{border-color:var(--glw)}
.cd.own::before{content:"";position:absolute;inset:0;border-radius:8px;
  box-shadow:0 0 14px rgba(255,209,102,.3) inset;pointer-events:none}
.ci{font-size:10px;color:var(--dim);letter-spacing:.12em}
.ck{font-size:12px;letter-spacing:.1em;font-weight:700}
.crec .ck{color:#8fb8d8}.cmem .ck{color:#d3aee0}.ceff .ck{color:var(--wrn)}.cjok .ck{color:#9aa4ac}
.ct{font-size:13px;line-height:1.6;flex:1}
.lbl{font-size:12.5px;font-weight:700;color:var(--glw);letter-spacing:.04em;
  border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:3px 0;margin:1px 0}
.lb2{display:block;color:var(--glw);font-size:12.5px;margin:2px 0 4px}
.tg{position:absolute;top:8px;right:9px;font-size:12px;color:var(--glw)}
.selno{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;
  background:var(--acc);color:#06110f;font-size:13px;font-weight:700;
  display:grid;place-items:center}
/* 直前に手札へ入ったカード */
.cd.new{border-color:var(--acc);animation:pop .45s ease-out}
.cd.pub{opacity:.62;border-style:dashed}
.newtag{position:absolute;top:-7px;left:-6px;background:var(--acc);color:#06110f;
  font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:10px}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.cd.new{animation:none}}

/* ---------- 場（他の個体） ---------- */
.pc{background:var(--pan);border:1px solid var(--ln);border-radius:8px;
  padding:11px;margin-bottom:9px}
.pc.act{border-color:var(--wrn);box-shadow:0 0 0 1px var(--wrn)}
.pc.nmd{opacity:.42}
.pc.tgt{border-color:var(--glw);box-shadow:0 0 0 2px var(--glw);cursor:pointer}
.pt{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.pt .nm{font-size:16px;font-weight:700;color:var(--fg)}
.pt .d{margin-left:auto;font-size:20px;color:var(--glw);font-variant-numeric:tabular-nums}
.pt .now{font-size:11px;background:var(--wrn);color:#180a04;padding:2px 8px;border-radius:20px;font-weight:700}
.pm{font-size:12px;color:var(--dim);margin-bottom:8px}
.mn{font-size:12.5px;line-height:1.55;border:1px solid var(--glw);color:var(--glw);
  background:rgba(255,209,102,.07);padding:8px 10px;margin-top:6px;border-radius:6px}
.mn .mid{font-size:10px;opacity:.7;letter-spacing:.1em;display:block}

/* 伏せ札のスロット */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:9px}
.slot{aspect-ratio:3/4;border:1px dashed var(--ln);background:#0d1216;border-radius:6px;
  display:grid;place-items:center;font-size:17px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.slot.rv{border:2px solid var(--glw);color:var(--glw);font-size:10px;letter-spacing:0}
.slot.tap{border:2px solid var(--glw);color:var(--glw);background:rgba(255,209,102,.12);
  cursor:pointer;font-size:19px;box-shadow:0 0 12px rgba(255,209,102,.25)}
.pickbtn{width:100%;margin-top:9px;border-color:var(--glw);color:var(--glw);
  background:rgba(255,209,102,.08);font-weight:700}
.stealhint{margin-top:9px;font-size:13px;color:var(--glw);text-align:center}

/* 照会ボード */
.inq{margin:8px 12px 0;padding:11px 13px;border-radius:8px;
  background:rgba(95,211,200,.07);border:1px solid var(--acc)}
.inq.priv{background:rgba(255,209,102,.08);border-color:var(--glw)}
.inq.priv .ih{color:var(--glw)}
.inq .ih{font-size:13px;color:var(--acc);font-weight:700}
.inq .ib{font-size:13.5px;line-height:1.6;margin:5px 0 9px}
.inq button{width:100%;padding:11px}
/* 相手を選ぶ */
.askbox{margin:8px 12px 0;padding:11px 13px;border-radius:8px;
  background:rgba(255,209,102,.09);border:2px solid var(--glw)}
.askbox .al{font-size:14px;color:var(--glw);margin-bottom:8px}
.askbox .tgts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.askbox .tgts button{padding:11px 2px;font-size:13px;border-radius:6px}

/* ---------- 情報・ログ ---------- */
.log{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:10px;
  font-size:13px;line-height:1.6}
.log>div{padding:7px 0;border-bottom:1px solid #202830}
.log>div:last-child{border-bottom:none}
.log .me{color:var(--acc)}
/* 情報データの1件 */
.ie .it{font-size:13.5px;line-height:1.6}
.ie.me .it{color:var(--acc)}
/* 魂の記憶：共有できない */
.ie.soul{border-left:3px solid var(--glw);padding-left:10px;margin:2px 0}
.ie.soul .it{color:var(--glw)}
.ie.soul.weak .it{color:#a99263}
.ie .sl{font-size:11px;letter-spacing:.12em;color:var(--glw);margin-bottom:3px}
.ie.soul.weak .sl{color:#a99263}
/* 説明を持たないノイズ表示（現象名を出さないための表示） */
.nz{display:block;font-family:ui-monospace,Menlo,monospace;letter-spacing:.24em;
  color:var(--glw);opacity:.85;font-size:13px;line-height:1.9}
.ir{display:flex;align-items:center;gap:10px;margin-top:4px}
.shb{padding:5px 12px;font-size:12px;margin-left:auto;border-radius:14px}
.tgts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.tgts button{padding:9px 2px;font-size:12px;border-radius:6px}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:16px 0 7px}

/* ---------- 下部アクション ---------- */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--ln);
  box-shadow:0 -10px 22px rgba(0,0,0,.7);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:7px;flex-wrap:wrap}
.bot button{flex:1 1 44%;padding:15px 6px;font-size:15px}
.bot button.pri{flex-basis:100%}

@media(min-width:700px){
  .hand{grid-template-columns:repeat(3,1fr)}
  .tabs{top:66px}
}
</style>

<!-- ============ ロビー ============ -->
<div id="lobby" class="lb">
  <div style="text-align:center;letter-spacing:.2em;color:var(--acc)">記 録 照 合 フ ェ ー ズ</div>
  <div class="hint" style="text-align:center">DEMO — 5端末用</div>
  <div id="lbErr"></div>
  <input id="code" placeholder="部屋コード（英数4文字）" maxlength="8" autocapitalize="characters">
  <button id="bJoin" class="pri">この部屋に入る／作る</button>
  <div id="seatBox" class="hide">
    <h2>席を選ぶ</h2>
    <div class="seats" id="seats"></div>
  </div>
  <div class="hint">同じ部屋コードを5人で入力してください。席は先着順です。</div>
</div>

<!-- ============ ゲーム ============ -->
<div id="game" class="hide">
  <div class="hd">
    <div class="hd1">
      <span id="rc"></span>
      <span>ROUND <b id="rd">1</b></span>
      <span id="stg"></span>
      <span>山札 <b id="dkn">0</b></span>
      <span>残り <b id="dk">0</b>組</span>
      <span>成立 <b id="pr">0</b>/25</span>
    </div>
    <div class="hd2">
      <span class="pill" id="ph">待機</span>
      <span class="hint" id="whose"></span>
      <span class="tm" id="tm">--</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="hand">手札<span class="n" id="nHand"></span></div>
      <div class="tab" data-tab="table">場<span class="n" id="nTbl"></span></div>
      <div class="tab" data-tab="info">情報<span class="n" id="nInf"></span></div>
    </div>
  </div>

  <div id="cue"></div>
  <div id="msg"></div>
  <div id="inq"></div>
  <div id="ask"></div>

  <div class="pane" id="pHand"><div class="hand" id="hand"></div><div id="pubmine"></div></div>
  <div class="pane hide" id="pTable"><div id="pcs"></div></div>
  <div class="pane hide" id="pInfo">
    <div class="log" id="inf"></div>
  </div>

  <div class="bot" id="bot"></div>
</div>

<!-- ?v= はキャッシュ避け。cards.js を更新したら数字を1つ増やすこと -->
<script src="cards.js?v=11"></script>
<script src="firebase-config.js?v=11"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = i => document.getElementById(i);
const R = n => Math.floor(Math.random()*n);
const sh = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v=>v!=null) : Object.values(x);

let db, roomRef, S=null, mySeat=null, code=null, sel=[], tick=null;
const SOLO = new URLSearchParams(location.search).has("solo");

// 自分の端末にだけ出す一時メッセージ（DBに書かないので他人には見えない）
let flash = null;
function setFlash(html){
  flash = html;
  setTimeout(() => { if (flash === html) { flash = null; render(); } }, 8000);
}

// ---------- 起動 ----------
function lbErr(html){ $("lbErr").innerHTML = `<div class="msg w">${html}</div>`; }
try {
  if (typeof STAGES === "undefined" || typeof PAIR === "undefined")
    throw new Error("cards.js が古いか、読み込めていません。ページを再読み込み（キャッシュ削除）してください。");
  if (typeof FIREBASE_CONFIG === "undefined" || String(FIREBASE_CONFIG.databaseURL).includes("ここに貼る"))
    throw new Error("firebase-config.js が未設定です。README の手順で設定を貼り付けてください。");
  db = getDatabase(initializeApp(FIREBASE_CONFIG));
} catch(e) {
  lbErr(e.message || "初期化に失敗しました。");
  $("bJoin").disabled = true;
}

$("bJoin").onclick = async () => {
  const c = $("code").value.trim().toUpperCase();
  if (c.length < 2) return;
  try {
  code = c; roomRef = ref(db, "rooms/"+code);
  const snap = await get(roomRef);
  // 旧仕様のデータが残っている部屋は作り直す
  if (snap.exists() && snap.val().schemaVersion !== 2){
    await set(roomRef, fresh());
  } else if (!snap.exists()) await set(roomRef, fresh());
  onValue(roomRef, s => { S = s.val(); render(); });
  if (SOLO){ // 1台で全席を動かす
    await update(roomRef, { seats:{0:"solo",1:"solo",2:"solo",3:"solo",4:"solo"}, host:0 });
    mySeat = 0; render(); return;
  }
  $("seatBox").classList.remove("hide");
  } catch(e){ lbErr("接続に失敗しました：" + (e.message||e)); }
};
// 部屋をまっさらに戻す
window.resetRoom = async () => {
  if (!roomRef) return;
  if (!confirm("この部屋を最初から作り直します。全員の進行が消えます。よろしいですか？")) return;
  await set(roomRef, fresh());
  mySeat = null; sel = []; lastTurnKey = null;
  $("game").classList.add("hide"); $("lobby").classList.remove("hide");
  lbErr("部屋をリセットしました。もう一度、席を選んでください。");
};

const INIT_HAND = 2;   // 段階開始時に配る枚数。残りは山札になり、毎ラウンド1枚ずつ届く
const GAME_SEC = 45 * 60; // 第二テストの実プレイ上限
// その段階のカードを配り、残りを山札として返す
function dealStage(n, ps){
  const st = STAGES[n];
  let pool = sh([...st.pairs, ...st.eff]);
  if (n === 0 && typeof TUTORIAL_DEAL !== "undefined"){
    // 第1段階だけは固定配札。全員が同じ手順を1回ずつ体験できる輪になっている
    TUTORIAL_DEAL.forEach((cards, i) => cards.forEach(c => {
      ps[i].hand.push(c); pool = pool.filter(z => z !== c);
    }));
    return pool;
  }
  for (let k = 0; k < INIT_HAND; k++)
    for (let i = 0; i < 5; i++) if (pool.length) ps[i].hand.push(pool.shift());
  return pool;
}
function fresh(){
  const ps = [0,1,2,3,4].map(()=>({ hand:[], info:[] }));
  const deck = dealStage(0, ps);
  return {
    schemaVersion:2, phase:"lobby", stage:0, round:1, pairs:0, endAt:0, gameEndAt:0, host:null, deck,
    seats:{}, inq:{}, pub:{}, reveal:null,
    msg:"全員が席に着いたら、ホストの端末で「開始」を押してください。", logs:[], ps
  };
}
// 現在の段階で、まだ揃っていない対応の数
const pairsLeft = (ps, deck=[]) => (
  ps.reduce((n,p)=> n + arr(p.hand).filter(c=>PAIR[c]).length, 0)
  + arr(deck).filter(c=>PAIR[c]).length
) / 2;
const P5 = ["PC1","PC2","PC3","PC4","PC5"];
const me = () => S.ps[mySeat];
const wr = o => update(roomRef, o);
// 運営検証用。プレイヤー画面には表示しない。
function push(o, t, cls){ o.logs = [ {t, c:cls||""}, ...(o.logs || arr(S.logs)) ].slice(0,40); }

// ---------- 自動照合 ----------
// 手札に記憶記録と事件記録の対応が揃った瞬間、自動で情報データへ落とし込む。
// 補充によって新たな対応が生まれることがあるので、揃わなくなるまで繰り返す。
function resolvePairs(ps, deck, o){
  const souls = [], evts = [];
  let again = true, guard = 0;
  o.pairs = (o.pairs !== undefined) ? o.pairs : (S.pairs || 0);
  while (again && guard++ < 40){
    again = false;
    for (let s = 0; s < 5 && !again; s++){
      for (const c of [...ps[s].hand]){
        const m = PAIR[c];
        if (!m || !ps[s].hand.includes(c) || !ps[s].hand.includes(m)) continue;
        ps[s].hand = ps[s].hand.filter(z => z !== c && z !== m);   // 補充は無い。手札は減る
        const memId = (C[c].t === "mem") ? c : m;
        ps[s].info = [...ps[s].info, { t: INFO[c], f: "自分", src: memId }];
        const owner = C[c].o, os = P5.indexOf(owner);
        const strong = (os === s);
        souls.push({ to: os, strong, by: s });
        evts.push({ by:s, info:INFO[c], a:c, m });
        // 魂の記憶：当事者にだけ、共有できない記憶としてストックする
        if (SOUL[memId]) putSoul(ps[os], memId, strong);
        o.pairs++;
        push(o, `1組成立（内部記録：${P5[s]}／${c}＋${m}）`, "me");
        again = true; break;
      }
    }
  }
  if (souls.length) o.souls = { at: Date.now(), list: souls };
  if (evts.length){
    o.pairEvt = { at: Date.now(), list: evts };
    o.msg = `◆ 誰かの手元で${evts.length}組の照合が成立しました。`
          + `<br><span class="hint">成立させた個体と内容は公開されません</span>`;
    o.msgC = "s";
  }
  // その段階の対応が全て揃ったら、次の段階へ
  const activeDeck = (o.deck !== undefined) ? arr(o.deck) : (deck !== null && deck !== undefined ? arr(deck) : arr(S.deck));
  if (activeDeck.length === 0 && pairsLeft(ps, activeDeck) === 0) advanceStage(ps, o);
  return souls;
}
// 段階の進行
function advanceStage(ps, o){
  const cur = (o.stage !== undefined) ? o.stage : (S.stage || 0);
  if (cur >= STAGES.length - 1){ finish(o); return; }
  const next = cur + 1;
  // 持ち越しなし。使わなかった効果カードは破棄される
  const dropped = ps.reduce((n,p)=> n + p.hand.length, 0);
  ps.forEach(p => { p.hand = []; });
  o.deck = dealStage(next, ps);
  o.pub = {};
  const fmap = {};
  ps.forEach((p,i)=>{ fmap[i] = [...p.hand]; });
  mergeFresh(o, fmap);
  o.stage = next;
  o.phase = "wait"; o.pend = null; o.endAt = 0;
  o.inq = {}; o.reveal = null;
  o.msg = `<b>${STAGES[cur].name} 完了。</b>記録が全て復元されました。<br>`
        + (dropped ? `未使用の補助プログラム ${dropped}件は破棄されました。<br>` : "")
        + `続いて <b>${STAGES[next].name}「${STAGES[next].sub}」</b> の記録が配布されます。`;
  o.msgC = "s";
  push(o, `<b>${STAGES[cur].name} 完了</b> → ${STAGES[next].name} へ`, "me");
}
// 魂の記憶を積む。強度は最初に誰がペアを作ったかで確定し、後から変化しない。
// 戻り値：新しく保存した場合 true
function putSoul(p, memId, strong){
  const i = p.info.findIndex(x => x.soul && x.src === memId);
  if (i >= 0) return false;
  p.info = [...p.info, {
    t: strong ? SOUL[memId] : soulWeak(SOUL[memId]),
    f:"—", soul:true, weak:!strong, src:memId
  }];
  return strong;
}

// 直前に手札へ入ったカード（NEW表示用）
function mergeFresh(o, map){
  if (!Object.keys(map).length) return;
  const cur = (o.fresh && o.fresh.map) ? o.fresh.map : {};
  Object.entries(map).forEach(([k,v]) => { cur[k] = [...(cur[k]||[]), ...v]; });
  o.fresh = { at: Date.now(), map: cur };
}

// ---------- 席 ----------
async function takeSeat(i){
  await runTransaction(roomRef, s => {
    if (!s) return s;
    s.seats = s.seats || {};
    Object.keys(s.seats).forEach(k => { if (s.seats[k]===myId()) delete s.seats[k]; });
    s.seats[i] = myId();   // 使用中でも引き継ぐ（確認は呼び出し側で済ませている）
    if (s.host === null || s.host === undefined) s.host = i;
    return s;
  });
  mySeat = i; sel = []; render();
}
// sessionStorage はタブごとに独立するので、1台で複数タブを開けば別プレイヤーとして扱える
function myId(){ let v = sessionStorage.getItem("uzuid"); if(!v){ v = Math.random().toString(36).slice(2,10); sessionStorage.setItem("uzuid", v);} return v; }

// ---------- タイマー ----------
function startTick(){
  if (tick) return;
  tick = setInterval(() => {
    if (!S || !S.endAt) { $("tm").textContent="--"; $("tm").className="tm"; return; }
    const s = Math.max(0, Math.ceil((S.endAt - Date.now())/1000));
    $("tm").textContent = s; $("tm").className = "tm" + (s<=5?" hot":"");
    if (s===0 && isHost()) onTimeout();
  }, 300);
}

// ---------- 進行（ラウンド制・自由行動） ----------
const ROUND_SEC = 120;   // 1ラウンドの自由行動時間

function beginRound(){
  const o = {};
  const ps = clonePs();
  const deck = arr(S.deck);
  // ラウンド開始時、全員が山札から1枚ずつ引く
  const got = {};
  for (let i = 0; i < 5; i++){
    if (!deck.length) break;
    const c = deck.shift();
    ps[i].hand.push(c);
    got[i] = [c];
  }
  o.ps = ps; o.deck = deck;
  o.phase = "round";
  o.round = (S.phase === "lobby" || S.phase === "wait") ? (S.round || 1) : (S.round || 1) + 1;
  o.fresh = null;
  mergeFresh(o, got);
  const gameEndAt = S.gameEndAt || (Date.now() + GAME_SEC * 1000);
  o.gameEndAt = gameEndAt;
  o.endAt = Math.min(Date.now() + ROUND_SEC * 1000, gameEndAt);
  o.msg = ""; o.msgC = "";
  push(o, `<b>R${o.round}</b> 開始 ── 全員が記録を1件ずつ受信`);
  resolvePairs(ps, deck, o);
  wr(o);
}
function finish(o){
  o.phase="over"; o.endAt=0;
  const psx = o.ps || S.ps;
  const n = (o.pairs!==undefined) ? o.pairs : S.pairs;
  const jk = psx.findIndex(p => arr(p.hand).includes("X-01"));
  o.msg = `<b>記録照合フェーズ終了</b>　成立 ${n}/25 組<br>`
        + (jk >= 0
            ? `全ての記録が復元されました。それでも <b>${P5[jk]}</b> の手元に、対応の無い1件が残っています。`
            : `全ての記録が復元されました。`);
  o.msgC = "s";
}
function onTimeout(){
  if (S.gameEndAt && Date.now() >= S.gameEndAt) forceFinishAtLimit();
  else if (S.phase === "round") beginRound();   // ラウンド時間切れで次へ
}

// 45分上限。未配布・未成立の記録はUZUが自動復元し、必ず投票へ進める。
function forceFinishAtLimit(){
  const ps = clonePs();
  let cursor = 0;
  for (let st=S.stage||0; st<STAGES.length; st++){
    const memIds = STAGES[st].pairs.filter(c=>C[c]&&C[c].t==="mem");
    for (const memId of memIds){
      if (ps.some(p=>arr(p.info).some(x=>!x.soul&&x.src===memId))) continue;
      const owner = P5.indexOf(C[memId].o);
      const to = cursor++ % 5;
      ps[to].info = [...arr(ps[to].info), {t:INFO[memId],f:"UZU自動復元",src:memId}];
      if (SOUL[memId]) putSoul(ps[owner],memId,owner===to);
    }
  }
  ps.forEach(p=>{p.hand=arr(p.hand).filter(c=>!PAIR[c]&&c!=="X-01")});
  ps[0].hand.push("X-01");
  const o={ps,deck:[],stage:2,pairs:25,phase:"over",endAt:0,
    msg:"<b>実プレイ45分が終了しました。</b><br>未復元の記録はUZUが自動処理しました。犯人投票へ進んでください。<br><span class='hint'>PC1の手元に、対応のない1件が残っています。</span>",msgC:"w"};
  push(o,"実プレイ45分終了。残りの記録を自動復元");
  wr(o);
}

// 事件記録は危険性が低いので出しやすい。記憶記録は犯人に繋がるので出すと不利になりうる。
function publishCard(){
  const c = sel[0]; if (!c) return;
  const d = C[c];
  if (d.t === "mem" && !confirm(
      "これは記憶記録です。\n出すと、この出来事の当事者があなただと疑われる材料になります。\n\n本当に公開しますか？")) return;
  const u = { ["pub/" + c]: mySeat };
  push(u, `${P5[mySeat]} が <b>${c}</b>（${d.t==="rec"?"事件記録":"記憶記録"}）を公開した`);
  sel = []; wr(u);
}

// ---------- 手札タップ ----------
// 照合は自動なので、選択は「効果カードを使う」「交換に出す」用の1枚だけ
function tapHand(c){

// ---------- 効果カード ----------
function useEffect(){
  const id = sel[0], d = C[id];
  if (!confirm(`【${d.n}】\n${d.x}\n\n使用しますか？`)) return;
  const needTarget = ["優先アクセス権","完全アクセス権","強制照合","記録開示要求","個体入替"].includes(d.n);
  if (needTarget){
    chooseTarget(`<b>${d.n}</b>：どの個体を対象にしますか？`, ti => applyEffect(id, ti));
    return;
  }
  if (d.n === "記録差押"){
    const cands = Object.entries(S.pub||{}).filter(([c,o])=>o!==mySeat && C[c].t==="rec");
    if (!cands.length){ setFlash("場に、引き取れる事件記録がありません。"); return; }
    pickPub = { card:id, list:cands };   // 場から1件選ぶモードへ
    showTab("table"); render(); return;
  }
  applyEffect(id, null);
}
let pickPub = null;   // 記録差押：場から選んでいる最中

function applyEffect(id, ti, targetCard){
  const d = C[id];
  const ps = clonePs();
  ps[mySeat].hand = ps[mySeat].hand.filter(c=>c!==id);
  const o = { ps };
  const T = (ti!=null) ? P5[ti] : "";

  if (d.n === "優先アクセス権" || d.n === "完全アクセス権"){
    const pub = S.pub || {};
    const hidden = arr(ps[ti].hand).filter(c => pub[c] === undefined);
    const cards = d.n==="完全アクセス権" ? hidden : (hidden.length ? [hidden[R(hidden.length)]] : []);
    o.reveal = { to:mySeat, of:ti, cards, at:Date.now() };
    setFlash(`<b>${d.n}</b>：${T} の伏せ札を閲覧しました。<br>「場」タブに内容が出ています。`);
    tab = "table";
  }
  else if (d.n === "強制照合"){
    const pub = S.pub || {};
    const hidden = arr(ps[ti].hand).filter(c => pub[c] === undefined);
    if (!hidden.length){ setFlash(`${T} に伏せ札がありません。`); return; }
    const c = hidden[R(hidden.length)];
    ps[ti].hand = ps[ti].hand.filter(z=>z!==c);
    ps[mySeat].hand = [...ps[mySeat].hand, c];
    mergeFresh(o, { [mySeat]: [c] });
    o.giveEvt = { at: Date.now(), to: mySeat, from: ti, card: c, forced: true };
    const k = {rec:"事件記録",mem:"記憶記録",eff:"補助プログラム",jok:"事後通信"}[C[c].t];
    setFlash(`<b>強制照合</b>：${T} から <b>${c}</b>（${k}）を受け取りました。<br>${C[c].x}`);
    o.msg = `<b>${P5[mySeat]}</b> が <b>強制照合</b> を発動。${T} から1件を強制的に受け取りました。`; o.msgC="w";
  }
  else if (d.n === "記録開示要求"){
    const pub = S.pub || {};
    const recs = arr(ps[ti].hand).filter(c => C[c].t==="rec" && pub[c] === undefined);
    if (!recs.length){ setFlash(`${T} に、未公開の事件記録がありません。`); return; }
    const c = recs[R(recs.length)];
    o["pub/"+c] = ti;
    o.msg = `<b>記録開示要求</b>：${T} の <b>${c}</b> が強制的に公開されました。`; o.msgC="w";
  }
  else if (d.n === "個体入替"){
    const mine = ps[mySeat].hand, theirs = ps[ti].hand;
    ps[mySeat].hand = theirs; ps[ti].hand = mine;
    // 公開状態は持ち主ごと入れ替わる
    Object.entries(S.pub||{}).forEach(([c,ow])=>{
      if (ow===mySeat) o["pub/"+c] = ti;
      else if (ow===ti) o["pub/"+c] = mySeat;
    });
    o.msg = `<b>個体入替</b>：${P5[mySeat]} と ${T} の手札が丸ごと入れ替わりました。`; o.msgC="w";
  }
  else if (d.n === "記録差押"){
    const c = targetCard;
    const owner = (S.pub||{})[c];
    if (owner === undefined) return;
    ps[owner].hand = ps[owner].hand.filter(z=>z!==c);
    ps[mySeat].hand = [...ps[mySeat].hand, c];
    o["pub/"+c] = null;
    mergeFresh(o, { [mySeat]: [c] });
    o.msg = `<b>記録差押</b>：${P5[mySeat]} が、場の <b>${c}</b> を ${P5[owner]} から引き取りました。`; o.msgC="w";
  }
  else if (d.n === "記録監査"){
    const pub = S.pub || {};
    const mv = ps.map(x=>{ const r=x.hand.filter(c=>C[c].t==="rec" && pub[c]===undefined); return r.length?r[R(r.length)]:null; });
    mv.forEach((c,i)=>{ if(!c) return; ps[i].hand=ps[i].hand.filter(z=>z!==c); ps[(i+4)%5].hand.push(c); });
    o.msg = "<b>記録監査</b>：全個体が、未公開の事件記録を1件ずつ左隣へ移しました。"; o.msgC="w";
  }
  else if (d.n === "全体再構成"){
    let pool = sh(ps.flatMap(x=>x.hand)); ps.forEach(x=>x.hand=[]);
    let i=0; while(pool.length){ ps[i%5].hand.push(pool.shift()); i++; }
    o.pub = {};   // 公開状態はすべて解除
    o.msg = "<b>全体再構成</b>：全個体の記録が回収され、再配分されました。公開状態は解除されています。"; o.msgC="w";
  }

  push(o, `${P5[mySeat]} が <b>${d.n}</b> を使用${T?`（対象：${T}）`:""}`);
  resolvePairs(ps, null, o);
  pickPub = null; sel=[]; wr(o);
}

// ---------- 照会（手札を1枚だけ全体公開して、対応を探す）----------
// 全員に見せる＝照会 ／ 1人だけに見せる＝個別開示
function showCard(){
  const c = sel[0]; if (!c) return;
  chooseTarget(`<b>${c}</b> を誰に見せますか？<br><span class="hint">全員＝照会（対応が見つかりやすい）／1人＝密かに交渉できる</span>`,
    v => {
      const u = {};
      if (v === "all"){
        u["inq/i"+Date.now()] = { by:mySeat, card:c, all:true };
        push(u, `${P5[mySeat]} が <b>${c}</b> を全員へ照会した`);
      } else {
        u["inq/i"+Date.now()] = { by:mySeat, card:c, to:v };
        push(u, `${P5[mySeat]} が ${P5[v]} へ1枚だけ見せた`);
      }
      sel = []; wr(u);
    }, true);
}
function renderInq(){
  // 全体照会は全員に、個別開示は当事者2人にだけ見せる
  const list = Object.entries(S.inq || {})
    .filter(([,q]) => q.all || q.to === mySeat || q.by === mySeat);
  if (!list.length){ $("inq").innerHTML = ""; return; }
  $("inq").innerHTML = list.map(([id,q])=>{
    const d = C[q.card];
    const kind = {rec:"事件記録",mem:"記憶記録",eff:"効果カード",jok:"事後通信"}[d.t];
    const mine = q.by === mySeat;
    const head = q.all
      ? `${P5[q.by]} の照会（全員）`
      : (mine ? `${P5[q.to]} だけに見せています` : `${P5[q.by]} があなただけに見せた`);
    return `<div class="inq ${q.all?"":"priv"}">
      <div class="ih">${head}　<span class="hint">${q.card}／${kind}</span></div>
      ${LABEL[q.card]?`<div class="lbl" style="margin:4px 0">${LABEL[q.card]}</div>`:""}\n      <div class="ib">${d.x}</div>
      ${mine
        ? `<button data-x="${id}" class="dgr">取り下げる</button>`
        : `<button data-r="${id}" ${sel.length===1?"":"disabled"}>${sel.length===1?`${sel[0]} を渡す`:"応じる（手札を1枚選ぶ）"}</button>`}
    </div>`;
  }).join("");
  $("inq").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>respondInq(b.dataset.r));
  $("inq").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>wr({["inq/"+b.dataset.x]:null}));
}
function respondInq(id){
  const q = S.inq[id]; if (!q || sel.length!==1) return;
  giveTo(sel[0], q.by, true);
}

// ---------- カードを渡す（片道。対価はカードではなく情報データ） ----------
function giveTo(c, ti, viaInq){
  const ps = clonePs();
  if (!ps[mySeat].hand.includes(c)) return;
  ps[mySeat].hand = ps[mySeat].hand.filter(z=>z!==c);
  ps[ti].hand = [...ps[ti].hand, c];
  const u = { ps, ["pub/"+c]: null };   // 渡したら公開状態は解除される
  mergeFresh(u, { [ti]: [c] });
  push(u, `${P5[mySeat]} → ${P5[ti]} へ <b>${c}</b> を渡した${viaInq?"（開示に応じて）":""}`);
  u.giveEvt = { at: Date.now(), to: ti, from: mySeat, card: c };
  resolvePairs(ps, null, u);
  setFlash(`<b>${P5[ti]} へ渡しました</b><br>${c}`);
  sel = []; wr(u);
}
function makeOffer(){
  const c = sel[0]; if (!c) return;
  chooseTarget(`<b>${c}</b> を誰に渡しますか？<br><span class="hint">見返りのカードは要りません。対価は交渉で決めてください。</span>`,
    ti => giveTo(c, ti, false));
}


// ---------- 相手を選ぶ（prompt を使わない共通UI）----------
let askTarget = null;
function chooseTarget(label, cb, withAll){ askTarget = { label, cb, all:!!withAll }; render(); }
function renderAsk(){
  if (!askTarget){ $("ask").innerHTML = ""; return; }
  $("ask").innerHTML = `<div class="askbox"><div class="al">${askTarget.label}</div>
    <div class="tgts">
      ${askTarget.all ? `<button data-ask="all" class="pri">全員</button>` : ""}
      ${P5.map((n,j)=> j===mySeat ? "" : `<button data-ask="${j}">${n}</button>`).join("")}
      <button data-ask="x" class="dgr">やめる</button>
    </div></div>`;
  $("ask").querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{
    const v = b.dataset.ask, cb = askTarget.cb;
    askTarget = null;
    if (v === "x") return render();
    cb(v === "all" ? "all" : Number(v));
  });
}

// ---------- 情報データの共有 ----------
let shareOpen = null;   // 「渡す」を開いている情報の番号
window.toggleShare = i => { shareOpen = (shareOpen===i) ? null : i; render(); };
function sendInfo(idx, to){
  const info = arr(me().info)[idx]; if (!info) return;
  if (info.soul){ setFlash('<span class="nz">▓▒░ ────── ▓░▒</span>'); return; }
  const targets = (to==="all") ? [0,1,2,3,4].filter(i=>i!==mySeat) : [Number(to)];
  const ps = clonePs();
  const sent = [], revived = [];
  targets.forEach(t=>{
    if (ps[t].info.some(x => !x.soul && x.t === info.t)) return;   // 既に持っていれば入れない
    ps[t].info = [...ps[t].info, { t: info.t, f: P5[mySeat], src: info.src }];
    sent.push(t);
    // 強度は「誰がペアを作ったか」で確定する。後から情報を受け取っても強度は変わらない。
  });
  const u = { ps };
  if (sent.length){
    u.infoEvt = { at: Date.now(), to: sent, from: mySeat, revived };
    push(u, `${P5[mySeat]} → ${sent.map(t=>P5[t]).join("・")} へ情報データを共有`);
    setFlash(`<b>情報を渡しました</b><br>${sent.map(t=>P5[t]).join("・")} へ`);
  } else {
    setFlash("その情報は、相手が既に持っています。");
  }
  shareOpen = null; wr(u);
}

// ---------- ボトムバー ----------
function renderBottom(){
  const b = [];
  // 選択中に出せるものを最優先で
  if (sel.length===1 && C[sel[0]].t==="eff"){
    const ok = (S.phase==="round");
    b.push([ok?`${C[sel[0]].n} を使う`:"ラウンド中のみ使えます","pri",ok?useEffect:null]);
  }
  if (S.phase==="lobby" && isHost()) b.push(["開始","pri",()=>beginRound()]);
  if (S.phase==="wait" && isHost()) b.push(["次のラウンドへ","pri",()=>beginRound()]);
  if (S.phase==="round"){
    const pubbed = (S.pub||{})[sel[0]] !== undefined;
    b.push([sel.length===1 ? (pubbed?"公開済み":`${sel[0]} を公開`) : "公開（1枚選ぶ）",
            "pri", (sel.length===1 && !pubbed) ? publishCard : null]);
    b.push([sel.length===1?"1人だけに見せる":"個別開示（1枚選ぶ）","",sel.length===1?showCard:null]);
    b.push([sel.length===1?"カードを渡す":"渡す（1枚選ぶ）","",sel.length===1?makeOffer:null]);
    b.push([`情報を渡す（${arr(me().info).length}件）`,"",()=>{ showTab("info"); }]);
    if (isHost()) b.push(["次のラウンドへ →","dgr",()=>beginRound()]);
  }

  $("bot").innerHTML = b.map((x,i)=>`<button data-b="${i}" class="${x[1]}" ${x[2]?"":"disabled"}>${x[0]}</button>`).join("");
  $("bot").querySelectorAll("[data-b]").forEach(e=>{ const f=b[+e.dataset.b][2]; if(f) e.onclick=f; });
  fitBottom();
}
// 下部バーは折り返して高さが変わるので、実測して本文の下余白を合わせる
function fitBottom(){
  requestAnimationFrame(()=>{
    const h = $("bot").offsetHeight || 0;
    document.body.style.paddingBottom = (h + 18) + "px";
  });
}
addEventListener("resize", fitBottom);

// ---------- 魂の記憶の通知 ----------
// カードを受け取ったとき
let lastGive = 0;
setInterval(()=>{
  if (!S || !S.giveEvt || mySeat===null) return;
  if (S.giveEvt.at === lastGive) return;
  lastGive = S.giveEvt.at;
  if (S.giveEvt.to !== mySeat) return;
  const c = S.giveEvt.card, d = C[c];
  const k = {rec:"事件記録",mem:"記憶記録",eff:"補助プログラム",jok:"事後通信"}[d.t];
  setFlash(`<b>${P5[S.giveEvt.from]} から受け取りました</b><br>${c}（${k}）<br>${d.x}`);
  showTab("hand");
  if (navigator.vibrate) navigator.vibrate(45);
}, 400);

// 情報を受け取ったとき
let lastInfo = 0;
setInterval(()=>{
  if (!S || !S.infoEvt || mySeat===null) return;
  if (S.infoEvt.at === lastInfo) return;
  lastInfo = S.infoEvt.at;
  if (!arr(S.infoEvt.to).includes(mySeat)) return;
  const woke = arr(S.infoEvt.revived).includes(mySeat);
  setFlash(woke
    ? `<b>${P5[S.infoEvt.from]} から情報データを受け取りました</b><br>情報タブで確認できます。`
      + `<br><br><span class="nz">▓▒░▒▓░ ──────────</span>`
    : `<b>${P5[S.infoEvt.from]} から情報データを受け取りました</b><br>情報タブで確認できます。`);
  showTab("info");
  if (navigator.vibrate) navigator.vibrate(woke ? [90,60,90,60,140] : 50);
}, 400);

// ペア成立：成立させた本人にだけ、得た情報の中身を出す
let lastPair = 0;
setInterval(()=>{
  if (!S || !S.pairEvt || mySeat===null) return;
  if (S.pairEvt.at === lastPair) return;
  lastPair = S.pairEvt.at;
  const mine = arr(S.pairEvt.list).filter(e => e.by === mySeat);
  if (!mine.length) return;
  setFlash(`<b>照合が成立しました（${mine.length}組）</b><br>`
    + mine.map(e=>`${e.a}＋${e.m}<br>▶ ${e.info}`).join("<br><br>")
    + `<br><br><span class="hint">情報タブに保存されました。ペア成立による補充はありません。</span>`);
  tab = "hand";
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
}, 400);

let lastSoul = 0;
setInterval(()=>{
  if (!S || !S.souls || mySeat===null) return;
  if (S.souls.at === lastSoul) return;
  lastSoul = S.souls.at;
  // 5台すべてに同じノイズを出し、誰へ届いたかを隠す。実データは当事者の情報欄にだけ入っている。
  setFlash('<span class="nz">▓▒░▒▓░▒░▓▒ ──────────</span>');
  if (navigator.vibrate) navigator.vibrate([70,50,70]);
}, 500);
</script>
</html>

<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記録照合フェーズ — DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c0e; --pan:#151a1e; --pan2:#1c232a; --ln:#2b333b;
  --fg:#e4ebf0; --dim:#7d8892; --acc:#5fd3c8; --wrn:#ff7a45; --glw:#ffd166;
  --phase:var(--acc);
}
html,body{background:var(--bg);color:var(--fg);
  font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body{max-width:820px;margin:0 auto;padding:0 0 84px}
button{font-family:inherit;font-size:15px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px 14px;cursor:pointer;border-radius:6px;
  transition:transform .06s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.28}
button.pri{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
button.dgr{border-color:var(--wrn);color:var(--wrn)}
input{font-family:inherit;font-size:17px;background:var(--pan2);color:var(--fg);
  border:1px solid var(--ln);padding:13px;width:100%;border-radius:6px}
.hide{display:none !important}
.hint{font-size:12px;color:var(--dim)}

/* ---------- ロビー ---------- */
.lb{max-width:400px;margin:44px auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* ---------- ヘッダ ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:2px solid var(--phase);padding:8px 0 9px}
.hd1,.hd2{padding:0 12px}
.pane{padding-top:10px}
.hd1{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim)}
.hd1 b{color:var(--fg);letter-spacing:.06em}
.hd2{display:flex;align-items:center;gap:12px;margin-top:2px}
.pill{font-size:13px;letter-spacing:.16em;color:#06110f;background:var(--phase);
  padding:3px 12px;border-radius:20px;font-weight:700}
.tm{font-size:30px;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums;
  color:var(--phase)}
.tm.hot{color:var(--wrn);animation:bl .8s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}

/* ---------- 指示バナー ---------- */
.cue{margin:10px 12px 0;padding:12px 14px;border-radius:8px;font-size:15px;
  background:var(--pan);border:1px solid var(--phase);line-height:1.6}
.cue.turn{background:rgba(255,122,69,.14);border-color:var(--wrn);border-width:2px}
.cue b{color:var(--fg)}
.cue .big{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.msg{margin:8px 12px 0;padding:10px 13px;border-radius:8px;font-size:14px;
  background:var(--pan);border:1px solid var(--ln)}
.msg.w{border-color:var(--wrn);color:#ffc7ad}
.msg.s{border-color:var(--glw);color:var(--glw);background:rgba(255,209,102,.08)}

/* ---------- タブ ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;background:var(--bg);padding:9px 12px 0}
.tab{padding:11px 4px;border-radius:8px;background:var(--pan);border:1px solid var(--ln);
  text-align:center;font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--phase);color:#06110f;border-color:var(--phase);font-weight:700}
.tab .n{font-size:11px;opacity:.7;margin-left:3px}
.pane{padding:0 12px}

/* ---------- 自分の手札 ---------- */
.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cd{border:1px solid var(--ln);background:var(--pan);border-radius:8px;padding:11px;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;
  min-height:150px}
.cd.sel{border-color:var(--acc);background:#16262a;box-shadow:0 0 0 2px var(--acc)}
.cd.own{border-color:var(--glw)}
.cd.own::before{content:"";position:absolute;inset:0;border-radius:8px;
  box-shadow:0 0 14px rgba(255,209,102,.3) inset;pointer-events:none}
.ci{font-size:10px;color:var(--dim);letter-spacing:.12em}
.ck{font-size:12px;letter-spacing:.1em;font-weight:700}
.crec .ck{color:#8fb8d8}.cmem .ck{color:#d3aee0}.ceff .ck{color:var(--wrn)}.cjok .ck{color:#9aa4ac}
.ct{font-size:13px;line-height:1.6;flex:1}
.tg{position:absolute;top:8px;right:9px;font-size:12px;color:var(--glw)}
.selno{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;
  background:var(--acc);color:#06110f;font-size:13px;font-weight:700;
  display:grid;place-items:center}

/* ---------- 場（他の個体） ---------- */
.pc{background:var(--pan);border:1px solid var(--ln);border-radius:8px;
  padding:11px;margin-bottom:9px}
.pc.act{border-color:var(--wrn);box-shadow:0 0 0 1px var(--wrn)}
.pc.nmd{opacity:.42}
.pc.tgt{border-color:var(--glw);box-shadow:0 0 0 2px var(--glw);cursor:pointer}
.pt{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.pt .nm{font-size:16px;font-weight:700;color:var(--fg)}
.pt .d{margin-left:auto;font-size:20px;color:var(--glw);font-variant-numeric:tabular-nums}
.pt .now{font-size:11px;background:var(--wrn);color:#180a04;padding:2px 8px;border-radius:20px;font-weight:700}
.pm{font-size:12px;color:var(--dim);margin-bottom:8px}
.mn{font-size:12.5px;line-height:1.55;border:1px solid var(--ln);background:#0f1418;
  padding:8px 10px;margin-bottom:5px;border-radius:6px}
.mn .mid{font-size:10px;color:var(--dim);letter-spacing:.1em;display:block}
.backs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bk{flex:1;min-width:52px;text-align:center;font-size:11px;color:var(--dim);
  border:1px dashed var(--ln);background:#0d1216;padding:12px 2px;border-radius:6px}
.bk.tap,.mn.tap{border-style:solid;border-color:var(--glw);color:var(--glw);cursor:pointer}
.bk.rv{border-style:solid;border-color:var(--glw);color:var(--glw);font-size:11px;
  text-align:left;padding:8px 9px;line-height:1.5}

/* ---------- 情報・ログ ---------- */
.log{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:10px;
  font-size:13px;line-height:1.6}
.log>div{padding:7px 0;border-bottom:1px solid #202830}
.log>div:last-child{border-bottom:none}
.log .me{color:var(--acc)}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:16px 0 7px}

/* ---------- 下部アクション ---------- */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--ln);
  box-shadow:0 -10px 22px rgba(0,0,0,.7);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:7px;flex-wrap:wrap}
.bot button{flex:1 1 44%;padding:15px 6px;font-size:15px}
.bot button.pri{flex-basis:100%}

@media(min-width:700px){
  .hand{grid-template-columns:repeat(3,1fr)}
  .tabs{top:66px}
}
</style>

<!-- ============ ロビー ============ -->
<div id="lobby" class="lb">
  <div style="text-align:center;letter-spacing:.2em;color:var(--acc)">記 録 照 合 フ ェ ー ズ</div>
  <div class="hint" style="text-align:center">DEMO — 5端末用</div>
  <div id="lbErr"></div>
  <input id="code" placeholder="部屋コード（英数4文字）" maxlength="8" autocapitalize="characters">
  <button id="bJoin" class="pri">この部屋に入る／作る</button>
  <div id="seatBox" class="hide">
    <h2>席を選ぶ</h2>
    <div class="seats" id="seats"></div>
  </div>
  <div class="hint">同じ部屋コードを5人で入力してください。席は先着順です。</div>
</div>

<!-- ============ ゲーム ============ -->
<div id="game" class="hide">
  <div class="hd">
    <div class="hd1">
      <span id="rc"></span>
      <span>ROUND <b id="rd">1</b>/16</span>
      <span>山札 <b id="dk">0</b></span>
      <span>成立 <b id="pr">0</b>/25</span>
    </div>
    <div class="hd2">
      <span class="pill" id="ph">待機</span>
      <span class="hint" id="whose"></span>
      <span class="tm" id="tm">--</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="hand">手札<span class="n" id="nHand"></span></div>
      <div class="tab" data-tab="table">場<span class="n" id="nTbl"></span></div>
      <div class="tab" data-tab="info">情報<span class="n" id="nInf"></span></div>
    </div>
  </div>

  <div id="cue"></div>
  <div id="msg"></div>
  <div id="offers"></div>

  <div class="pane" id="pHand"><div class="hand" id="hand"></div></div>
  <div class="pane hide" id="pTable"><div id="pcs"></div></div>
  <div class="pane hide" id="pInfo">
    <div class="log" id="inf"></div>
    <h2>進行ログ</h2>
    <div class="log" id="lg"></div>
  </div>

  <div class="bot" id="bot"></div>
</div>

<script src="cards.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = i => document.getElementById(i);
const R = n => Math.floor(Math.random()*n);
const sh = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v=>v!=null) : Object.values(x);

let db, roomRef, S=null, mySeat=null, code=null, sel=[], localMode=null, tick=null;
const SOLO = new URLSearchParams(location.search).has("solo");

// ---------- 起動 ----------
try {
  if (String(FIREBASE_CONFIG.databaseURL).includes("ここに貼る")) throw new Error("cfg");
  db = getDatabase(initializeApp(FIREBASE_CONFIG));
} catch(e) {
  $("lbErr").innerHTML = '<div class="msg w">firebase-config.js が未設定です。README の手順で Firebase の設定を貼り付けてください。</div>';
  $("bJoin").disabled = true;
}

$("bJoin").onclick = async () => {
  const c = $("code").value.trim().toUpperCase();
  if (c.length < 2) return;
  code = c; roomRef = ref(db, "rooms/"+code);
  const snap = await get(roomRef);
  if (!snap.exists()) await set(roomRef, fresh());
  onValue(roomRef, s => { S = s.val(); render(); });
  if (SOLO){ // 1台で全席を動かす
    await update(roomRef, { seats:{0:"solo",1:"solo",2:"solo",3:"solo",4:"solo"}, host:0 });
    mySeat = 0; render(); return;
  }
  $("seatBox").classList.remove("hide");
};

function fresh(){
  // 3層（層の中だけシャッフル）を重ねてから、上から25枚を配る
  const stack = [...sh(LAYERS.up), ...sh(LAYERS.mid), ...sh(LAYERS.low)];
  const deal = stack.splice(0,25);
  return {
    phase:"lobby", round:1, pairs:0, ti:0, endAt:0, host:null,
    deck:stack,
    order:[0,1,2,3,4], named:[], seats:{}, pend:null, offers:{}, reveal:null,
    msg:"全員が席に着いたら、PC1の端末で「開始」を押してください。", logs:[],
    ps:[0,1,2,3,4].map(i=>({hand:deal.slice(i*5,i*5+5), info:[], dice:0, ovr:false}))
  };
}
const P5 = ["PC1","PC2","PC3","PC4","PC5"];
const me = () => S.ps[mySeat];
const wr = o => update(roomRef, o);
function push(o, t, cls){ o.logs = [ {t, c:cls||""}, ...(o.logs || arr(S.logs)) ].slice(0,40); }

// ---------- 自動照合 ----------
// 手札に記憶記録と事件記録の対応が揃った瞬間、自動で情報データへ落とし込む。
// 補充によって新たな対応が生まれることがあるので、揃わなくなるまで繰り返す。
function resolvePairs(ps, deck, o){
  const souls = [];
  let again = true, guard = 0;
  o.pairs = (o.pairs !== undefined) ? o.pairs : (S.pairs || 0);
  while (again && guard++ < 40){
    again = false;
    for (let s = 0; s < 5 && !again; s++){
      for (const c of [...ps[s].hand]){
        const m = PAIR[c];
        if (!m || !ps[s].hand.includes(c) || !ps[s].hand.includes(m)) continue;
        ps[s].hand = ps[s].hand.filter(z => z !== c && z !== m);
        ps[s].info = [...ps[s].info, { t: INFO[c], f: "自分" }];
        let n = 0; while (n < 2 && deck.length){ ps[s].hand.push(deck.shift()); n++; }
        const owner = C[c].o, os = P5.indexOf(owner);
        souls.push({ to: os, strong: os === s, by: s });
        o.pairs++;
        push(o, `<b>${P5[s]}</b> の手元で照合が成立（${c}＋${m}）`, "me");
        again = true; break;
      }
    }
  }
  if (souls.length) o.souls = { at: Date.now(), list: souls };
  if (o.pairs >= 25) finish(o);
  return souls;
}
// ps / deck を安全に取り出すヘルパ
const clonePs = () => S.ps.map(x => ({ ...x, hand: arr(x.hand), info: arr(x.info) }));

// ---------- 描画 ----------
let lastTurnKey = null;
function render(){
  if (!S) return;
  // ソロ確認モードでは、手番が変わったら自動でその席に切り替える（手動切替も可）
  if (SOLO && mySeat!==null && S.phase==="draw" && S.pend){
    const k = S.round+"-"+S.ti;
    if (k !== lastTurnKey){ lastTurnKey = k; mySeat = S.pend.by; sel = []; }
  }
  // 席選択
  $("seats").innerHTML = P5.map((n,i)=>{
    const taken = S.seats && S.seats[i];
    return `<button data-seat="${i}" ${taken&&i!==mySeat?"disabled":""} class="${i===mySeat?"pri":""}">${n}${taken?" ●":""}</button>`;
  }).join("");
  [...$("seats").children].forEach(b => b.onclick = () => takeSeat(+b.dataset.seat));
  if (mySeat===null) return;

  $("lobby").classList.add("hide"); $("game").classList.remove("hide");
  renderSolo();

  // --- 自分の状況を先に確定させる ---
  const pend = S.pend;
  const myTurn = pend && pend.by===mySeat && S.phase==="draw";
  localMode = myTurn ? pend.stage : null;
  const turn = S.phase==="draw" ? arr(S.order)[S.ti] : -1;

  // フェーズ色（交渉＝シアン／引き＝オレンジ）
  document.documentElement.style.setProperty("--phase",
    S.phase==="draw" ? "var(--wrn)" : "var(--acc)");

  // --- ヘッダ ---
  $("rc").innerHTML = `<b>${code}</b>・${P5[mySeat]}${SOLO?" <span class='hint'>SOLO</span>":""}`;
  $("rd").textContent = S.round; $("dk").textContent = arr(S.deck).length;
  $("pr").textContent = S.pairs;
  $("ph").textContent = {lobby:"待機中",nego:"交渉ターン",draw:"引きターン",wait:"ラウンド間",over:"終了"}[S.phase]||"";
  $("whose").textContent = S.phase==="draw" && turn>=0 ? `${P5[turn]} の手番` : "";

  // --- やることバナー ---
  const cue = {
    target:["あなたの番です","「場」から<b>引く相手を1人</b>選んでください（既に指名された人は選べません）"],
    steal : ["あなたの番です","相手の札から<b>引く1枚</b>を選んでください"],
  }[localMode];
  $("cue").innerHTML = cue
    ? `<div class="cue turn"><span class="big">${cue[0]}</span>${cue[1]}</div>`
    : S.phase==="nego"
      ? `<div class="cue"><span class="big">交渉ターン</span>カードは1対1で交換。情報データは何件でも渡せます。<b>約束を守る義務はありません。</b></div>`
      : S.phase==="draw"
        ? `<div class="cue"><span class="big">${P5[turn]} の手番</span>待っています。ペアが揃っていれば、この間にも照合できます。</div>` : "";
  $("msg").innerHTML = S.msg ? `<div class="msg ${S.msgC||""}">${S.msg}</div>` : "";

  // --- 場（他の個体） ---
  $("pcs").innerHTML = P5.map((n,i)=>{
    if (i===mySeat) return "";
    const p = S.ps[i], hand = arr(p.hand);
    const recs = hand.filter(c=>C[c].t==="rec"), hid = hand.filter(c=>C[c].t!=="rec");
    const named = arr(S.named).includes(i);
    const isTgt = localMode==="target" && !named;
    const isSteal = localMode==="steal" && pend && pend.from===i;
    const rv = S.reveal && S.reveal.to===mySeat && S.reveal.of===i ? arr(S.reveal.cards) : [];
    return `<div class="pc ${turn===i?"act":""} ${named&&S.phase==="draw"?"nmd":""} ${isTgt?"tgt":""}" ${isTgt?`data-t="${i}"`:""}>
      <div class="pt">
        <span class="nm">${n}</span>
        ${turn===i?'<span class="now">手番</span>':""}
        ${isTgt?'<span class="now" style="background:var(--glw);color:#231a04">選ぶ</span>':""}
        <span class="d">${p.dice||""}</span>
      </div>
      <div class="pm">手札 ${hand.length}枚 ／ 情報 ${arr(p.info).length}件${p.ovr?" ／ 優先":""}${named&&S.phase==="draw"?" ／ 指名済み":""}</div>
      ${recs.map(c=>`<div class="mn ${isSteal?"tap":""}" ${isSteal?`data-c="${c}"`:""}><span class="mid">${c}　事件記録</span>${C[c].x}</div>`).join("")}
      ${hid.length?`<div class="backs">${hid.map((c,k)=>
        rv.includes(c)
          ? `<div class="bk rv ${isSteal?"tap":""}" ${isSteal?`data-c="${c}"`:""}><span class="mid">${c}</span>${C[c].x}</div>`
          : `<div class="bk ${isSteal?"tap":""}" ${isSteal?`data-c="${c}"`:""}>■<br>${k+1}</div>`
      ).join("")}</div>`:""}
    </div>`;
  }).join("");
  $("pcs").querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>pickTarget(+e.dataset.t));
  $("pcs").querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>pickCard(e.dataset.c));

  // --- 自分の手札 ---
  const hand = arr(me().hand);
  $("hand").innerHTML = hand.map(c=>{
    const d = C[c], own = d.t==="mem" && d.o===P5[mySeat];
    const k = {rec:"事件記録",mem:"記憶記録",eff:`${d.ph==="nego"?"交渉":"引き"}／${d.n}`,jok:"事後通信"}[d.t];
    const on = sel.includes(c);
    return `<div class="cd c${d.t} ${on?"sel":""} ${own?"own":""}" data-h="${c}">
      ${on?'<span class="selno">✓</span>':""}
      ${own?'<span class="tg">◆ 自分</span>':""}
      <div class="ci">${c}</div><div class="ck">${k}</div><div class="ct">${d.x}</div></div>`;
  }).join("");
  $("hand").querySelectorAll("[data-h]").forEach(e=>e.onclick=()=>tapHand(e.dataset.h));

  // --- 情報・ログ ---
  const info = arr(me().info);
  $("inf").innerHTML = info.length
    ? info.map((x,i)=>`<div class="${x.f==="自分"?"me":""}">${i+1}. ${x.t}<div class="hint">入手：${x.f}</div></div>`).join("")
    : '<div class="hint">まだ情報がありません。ペアを作ると増えます。</div>';
  $("lg").innerHTML = arr(S.logs).map(l=>`<div class="${l.c}">${l.t}</div>`).join("");

  // --- タブ ---
  $("nHand").textContent = hand.length;
  $("nTbl").textContent = "";
  $("nInf").textContent = info.length || "";
  if (localMode==="target" || localMode==="steal") tab = "table";
  else if (localMode==="give") tab = "hand";
  showTab(tab);

  renderOffers(); renderBottom(); startTick();
}

// ---------- タブ ----------
let tab = "hand";
function showTab(t){
  tab = t;
  const map = { hand:"pHand", table:"pTable", info:"pInfo" };
  Object.entries(map).forEach(([k,id]) => $(id).classList.toggle("hide", k!==t));
  document.querySelectorAll(".tab").forEach(e => e.classList.toggle("on", e.dataset.tab===t));
}
document.querySelectorAll(".tab").forEach(e => e.onclick = () => showTab(e.dataset.tab));

// ---------- 席 ----------
async function takeSeat(i){
  await runTransaction(roomRef, s => {
    if (!s) return s;
    s.seats = s.seats || {};
    if (s.seats[i] && s.seats[i] !== myId()) return;
    Object.keys(s.seats).forEach(k => { if (s.seats[k]===myId()) delete s.seats[k]; });
    s.seats[i] = myId();
    if (s.host === null || s.host === undefined) s.host = i;
    return s;
  });
  mySeat = i; sel = []; render();
}
// sessionStorage はタブごとに独立するので、1台で複数タブを開けば別プレイヤーとして扱える
function myId(){ let v = sessionStorage.getItem("uzuid"); if(!v){ v = Math.random().toString(36).slice(2,10); sessionStorage.setItem("uzuid", v);} return v; }
const isHost = () => SOLO || (S && S.host === mySeat);

// ---------- ソロ確認モード（?solo=1）----------
function renderSolo(){
  if (!SOLO || mySeat===null) return;
  let bar = document.getElementById("solobar");
  if (!bar){
    bar = document.createElement("div");
    bar.id = "solobar";
    bar.style.cssText = "display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 12px 0";
    $("game").insertBefore(bar, $("cue"));
  }
  bar.innerHTML = P5.map((n,i)=>
    `<button data-s="${i}" class="${i===mySeat?"pri":""}" style="padding:9px 2px;font-size:13px;border-radius:6px">${n}</button>`).join("");
  bar.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ mySeat=+b.dataset.s; sel=[]; render(); });
}

// ---------- タイマー ----------
function startTick(){
  if (tick) return;
  tick = setInterval(() => {
    if (!S || !S.endAt) { $("tm").textContent="--"; $("tm").className="tm"; return; }
    const s = Math.max(0, Math.ceil((S.endAt - Date.now())/1000));
    $("tm").textContent = s; $("tm").className = "tm" + (s<=5?" hot":"");
    if (s===0 && isHost()) onTimeout();
  }, 300);
}

// ---------- 進行 ----------
function beginRound(){
  const o = {}; const ps = S.ps.map(p=>({...p, dice:R(6)+1}));
  const order = [0,1,2,3,4].sort((a,b)=>(ps[b].ovr?100:0)-(ps[a].ovr?100:0) || ps[b].dice-ps[a].dice);
  ps.forEach(p=>{ p.ovr=false; p.hand=arr(p.hand); p.info=arr(p.info); });
  const d0 = arr(S.deck);
  o.ps=ps; o.order=order; o.named=[]; o.ti=0; o.phase="nego"; o.pend=null; o.offers={}; o.reveal=null;
  o.deck = d0;
  resolvePairs(ps, d0, o);   // 初回配布や効果カードで既に揃っている場合の取りこぼしを拾う
  o.endAt = Date.now()+60000;
  o.msg = ""; o.msgC = "";   // 説明は指示バナー（cue）が出すので、msg はイベント通知専用
  push(o, `<b>R${S.round}</b> 抽選 → ` + order.map(i=>P5[i]+"("+ps[i].dice+")").join(" ／ "));
  wr(o);
}
function toDraw(){
  const o = { phase:"draw", ti:0, offers:{}, reveal:null };
  beginTurnInto(o, 0); wr(o);
}
function beginTurnInto(o, ti){
  const seat = arr(S.order)[ti];
  o.ti = ti; o.pend = { by:seat, stage:"target" };
  o.endAt = Date.now()+20000;
  o.msg = ""; o.msgC = "";   // 手番の案内は指示バナー（cue）が出す
}
function endTurn(o){
  if (o.phase === "over") return;   // 自動照合で25組に達していたら終了を優先
  const ti = S.ti + 1;
  if (ti >= 5) {
    if (S.round >= 16 || (o.pairs ?? S.pairs) >= 25) return finish(o);
    o.round = S.round + 1; o.phase = "nego"; o.pend = null; o.endAt = 0;
    o.msg = "ラウンド終了。ホストが「次のラウンド」を押してください。"; o.msgC = "";
    // 次ラウンドの抽選は beginRound で行う
    o.phase = "wait";
  } else beginTurnInto(o, ti);
}
function finish(o){
  o.phase="over"; o.endAt=0; o.pend=null;
  const n = (o.pairs!==undefined) ? o.pairs : S.pairs;
  const rest = S.ps.map((p,i)=>`${P5[i]}:${arr(p.hand).length}枚`).join(" ／ ");
  o.msg = `<b>記録照合フェーズ終了</b>　成立ペア ${n}/25　残り手札 → ${rest}`; o.msgC="w";
}
function onTimeout(){
  const o = {};
  if (S.phase==="nego"){ o.phase="draw"; beginTurnInto(o,0); push(o,"交渉ターン終了"); wr(o); return; }
  if (S.phase==="draw" && S.pend) autoResolve();
}

// ---------- 引きターン ----------
function pickTarget(i){
  if (!S.pend || S.pend.stage!=="target" || S.pend.by!==mySeat) return;
  if (arr(S.named).includes(i)) return;
  const o = { named:[...arr(S.named), i], pend:{...S.pend, from:i, stage:"steal"}, endAt: Date.now()+20000 };
  o.msg = `<b>${P5[mySeat]}</b> が ${P5[i]} を指名。引く1枚を選択中…`;
  localMode = null; wr(o);
}
function pickCard(c){
  const p = S.pend;
  if (!p || p.stage!=="steal" || p.by!==mySeat) return;
  const ps = clonePs(), d = arr(S.deck);
  ps[p.from].hand = ps[p.from].hand.filter(z=>z!==c);
  ps[p.by].hand = [...ps[p.by].hand, c];
  // 渡す動作は無い。引いたら手番終了。指名が一巡すれば全員5枚へ戻る
  const o = { ps, deck:d };
  push(o, `${P5[p.by]} が ${P5[p.from]} から1枚引いた`);
  resolvePairs(ps, d, o);
  endTurn(o); sel=[]; localMode=null; wr(o);
}
function skipTurn(){
  const p = S.pend, o = {};
  o.msg = `${P5[p.by]}：指名できる相手が残っていないため、このラウンドは引けません。`; o.msgC="w";
  push(o, `${P5[p.by]} は指名先が無く、引けなかった`);
  endTurn(o); wr(o);
}
function autoResolve(){
  const p = S.pend; if (!p) return;
  if (p.stage==="target"){
    const av = [0,1,2,3,4].filter(i=>i!==p.by && !arr(S.named).includes(i));
    if (!av.length) return skipTurn();
    const i = av[R(av.length)];
    const o = { named:[...arr(S.named), i], pend:{...p, from:i, stage:"steal"}, endAt: Date.now()+20000 };
    push(o, `<span style="color:var(--wrn)">自動処理</span> ${P5[p.by]} → ${P5[i]} を指名`);
    o.msg = "応答なし。優先度に従い、自動処理します。"; o.msgC="w"; wr(o); return;
  }
  if (p.stage==="steal"){
    const h = arr(S.ps[p.from].hand);
    if (!h.length) return skipTurn();
    const ps = clonePs(), d = arr(S.deck);
    const c = h[R(h.length)];
    ps[p.from].hand = ps[p.from].hand.filter(z=>z!==c);
    ps[p.by].hand = [...ps[p.by].hand, c];
    const o = { ps, deck:d };
    push(o, `<span style="color:var(--wrn)">自動処理</span> ${P5[p.by]} がランダムに1枚引いた`);
    o.msg="応答なし。優先度に従い、自動処理しました。"; o.msgC="w";
    resolvePairs(ps, d, o);
    endTurn(o); wr(o);
  }
}

// ---------- 手札タップ ----------
// 照合は自動なので、選択は「効果カードを使う」「交換に出す」用の1枚だけ
function tapHand(c){
  sel = sel.includes(c) ? [] : [c];
  render();
}

// ---------- 効果カード ----------
function useEffect(){
  const id = sel[0], d = C[id];
  if (!confirm(`【${d.n}】\n${d.x}\n\n使用しますか？`)) return;
  const ps = clonePs();
  const dk = arr(S.deck);
  ps[mySeat].hand = ps[mySeat].hand.filter(c=>c!==id);
  const o = { ps, deck:dk };
  if (d.n==="優先度上書き") ps[mySeat].ovr = true;
  if (d.n==="全体再構成"){
    let pool = sh(ps.flatMap(x=>x.hand)); ps.forEach(x=>x.hand=[]);
    let i=0; while(pool.length){ ps[i%5].hand.push(pool.shift()); i++; }
    push(o, "<b>全体再構成</b>：全手札を回収し再配分");
  }
  if (d.n==="記録監査"){
    const mv = ps.map(x=>{ const r=x.hand.filter(c=>C[c].t==="rec"); return r.length?r[R(r.length)]:null; });
    mv.forEach((c,i)=>{ if(!c) return; ps[i].hand=ps[i].hand.filter(z=>z!==c); ps[(i+4)%5].hand.push(c); });
    push(o, "<b>記録監査</b>：全員が事件記録を1件ずつ左隣へ");
  }
  if (d.n==="優先アクセス権" || d.n==="完全アクセス権"){
    const t = prompt("対象の個体番号を入力（1〜5）");
    const ti = P5.indexOf("PC"+String(t||"").trim());
    if (ti>=0 && ti!==mySeat){
      const h = arr(ps[ti].hand).filter(c=>C[c].t!=="rec");
      const cards = d.n==="完全アクセス権" ? h : (h.length ? [h[R(h.length)]] : []);
      o.reveal = { to:mySeat, of:ti, cards, at:Date.now() };
      push(o, `${P5[mySeat]} が ${P5[ti]} に <b>${d.n}</b> を使用`);
    }
  }
  if (d.n==="強制照合"){
    o.pend = { by:mySeat, stage:"target", forced:true };
    o.msg = `<b>強制照合</b>：対象を指名し、1枚引いて1枚渡してください。`; o.msgC="w";
    push(o, `${P5[mySeat]} が <b>強制照合</b> を使用`);
  }
  if (["相互置換","開示制御"].includes(d.n)){
    o.msg = `<b>${P5[mySeat]}</b> が <b>${d.n}</b> を使用しました。効果は口頭で合意のうえ、交渉ターンの交換機能で処理してください。`; o.msgC="w";
    push(o, `${P5[mySeat]} が <b>${d.n}</b> を使用（手動処理）`);
  }
  if (dk.length) ps[mySeat].hand.push(dk.shift());
  resolvePairs(ps, dk, o);
  sel=[]; wr(o);
}

// ---------- 交渉ターンの交換 ----------
function makeOffer(){
  const to = prompt("交換を申し込む相手の個体番号（1〜5）");
  const ti = P5.indexOf("PC"+String(to||"").trim());
  if (ti<0 || ti===mySeat) return;
  const id = "o"+Date.now();
  wr({ ["offers/"+id]: { from:mySeat, to:ti, card:sel[0] } });
  sel=[]; render();
}
function renderOffers(){
  const os = S.offers || {};
  const mine = Object.entries(os).filter(([,o])=>o.to===mySeat);
  $("offers").innerHTML = mine.map(([id,o])=>
    `<div class="msg w"><b>${P5[o.from]}</b> から交換の申請（相手が出す：${o.card}）<br>
     <span class="hint">自分の手札を1枚選んでから「承認」</span><br>
     <button data-ok="${id}" style="margin-top:6px">承認</button>
     <button data-ng="${id}" class="dgr" style="margin-top:6px">拒否</button></div>`).join("");
  $("offers").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>acceptOffer(b.dataset.ok));
  $("offers").querySelectorAll("[data-ng]").forEach(b=>b.onclick=()=>wr({["offers/"+b.dataset.ng]:null}));
}
function acceptOffer(id){
  const o = S.offers[id];
  if (sel.length!==1) { alert("自分の手札を1枚選んでください"); return; }
  const ps = clonePs(), d = arr(S.deck);
  ps[o.from].hand = ps[o.from].hand.filter(c=>c!==o.card).concat(sel[0]);
  ps[mySeat].hand = ps[mySeat].hand.filter(c=>c!==sel[0]).concat(o.card);
  const u = { ps, deck:d, ["offers/"+id]:null };
  push(u, `${P5[o.from]} ⇄ ${P5[mySeat]} が交換成立`);
  resolvePairs(ps, d, u);
  sel=[]; wr(u);
}
function shareInfo(){
  const info = arr(me().info);
  if (!info.length) return alert("渡せる情報がありません");
  const n = prompt("渡す情報の番号（1〜"+info.length+"）");
  const idx = parseInt(n,10)-1; if (!(idx>=0 && idx<info.length)) return;
  const to = prompt("渡す相手の個体番号（1〜5）");
  const ti = P5.indexOf("PC"+String(to||"").trim());
  if (ti<0 || ti===mySeat) return;
  const ps = S.ps.map(x=>({...x, hand:arr(x.hand), info:arr(x.info)}));
  ps[ti].info = [...ps[ti].info, { t:info[idx].t, f:P5[mySeat] }];
  const u = { ps };
  push(u, `${P5[mySeat]} → ${P5[ti]} へ情報データを共有`);
  wr(u);
}

// ---------- ボトムバー ----------
function renderBottom(){
  const b = [], p = S.pend, myTurn = p && p.by===mySeat && S.phase==="draw";

  // 選択中に出せるものを最優先で
  if (sel.length===1 && C[sel[0]].t==="eff"){
    const ok = (C[sel[0]].ph==="nego" && S.phase==="nego") || (C[sel[0]].ph==="draw" && myTurn);
    b.push([ok?`${C[sel[0]].n} を使う`:"このフェーズでは使えない","pri",ok?useEffect:null]);
  }
  if (S.phase==="lobby" && isHost()) b.push(["開始","pri",()=>beginRound()]);
  if (S.phase==="wait" && isHost()) b.push(["次のラウンドへ","pri",()=>beginRound()]);
  if (S.phase==="nego"){
    b.push([sel.length===1?"交換を申請":"交換（1枚選ぶ）","",sel.length===1?makeOffer:null]);
    b.push(["情報を渡す","",shareInfo]);
    if (isHost()) b.push(["交渉終了 →","dgr",()=>toDraw()]);
  }
  if (isHost() && S.phase==="draw") b.push(["自動処理","dgr",autoResolve]);

  $("bot").innerHTML = b.map((x,i)=>`<button data-b="${i}" class="${x[1]}" ${x[2]?"":"disabled"}>${x[0]}</button>`).join("");
  $("bot").querySelectorAll("[data-b]").forEach(e=>{ const f=b[+e.dataset.b][2]; if(f) e.onclick=f; });
}

// ---------- 魂の記憶の通知 ----------
let lastSoul = 0;
setInterval(()=>{
  if (!S || !S.souls || mySeat===null) return;
  if (S.souls.at === lastSoul) return;
  lastSoul = S.souls.at;
  const mine = arr(S.souls.list).filter(x => x.to === mySeat);
  if (!mine.length) return;
  const strong = mine.some(x => x.strong);
  const t = strong
    ? "◆ 強い記憶が蘇った。映像と音が、はっきりと戻ってくる。"
    : "◆ 弱い記憶。音だけが、遠くで鳴っている。";
  $("msg").innerHTML = `<div class="msg s">${t}${mine.length>1?`<br>（${mine.length}件）`:""}
    <br><span class="hint">この表示はあなたにしか出ていません</span></div>`;
  if (navigator.vibrate) navigator.vibrate(strong?[80,60,80]:[40]);
}, 500);
</script>

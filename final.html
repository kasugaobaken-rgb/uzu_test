*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c0e;--pan:#151a1e;--pan2:#1c232a;--ln:#2b333b;

html,body{background:var(--bg);color:var(--fg);
 font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.75}
body{max-width:820px;margin:0 auto;padding:0 0 96px}
button{font-family:inherit;font-size:15px;background:var(--pan2);color:var(--fg);
 border:1px solid var(--ln);padding:13px 14px;cursor:pointer;border-radius:6px}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.28}
button.pri{background:var(--acc);color:#06110f;border-color:var(--acc);font-weight:700}
button.dgr{border-color:var(--wrn);color:var(--wrn)}
input{font-family:inherit;font-size:17px;background:var(--pan2);color:var(--fg);
 border:1px solid var(--ln);padding:13px;width:100%;border-radius:6px}
.hide{display:none!important}
.hint{font-size:12px;color:var(--dim)}
.lb{max-width:400px;margin:44px auto;padding:0 18px;display:flex;flex-direction:column;gap:12px}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.hd{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--acc);padding:8px 0}
.hd.hot{border-color:var(--wrn)}
.hd1,.tabs{padding:0 12px}
.hd1{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
.hd1 b{color:var(--fg)}
.tm{font-size:26px;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.tm.hot{color:var(--wrn);animation:bl .8s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.tab{padding:10px 2px;border-radius:8px;background:var(--pan);border:1px solid var(--ln);
 text-align:center;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);color:#06110f;border-color:var(--acc);font-weight:700}
.pane{padding:12px}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:16px 0 7px}
.doc{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:15px;font-size:14px}
.doc h3{font-size:17px;margin:14px 0 7px;color:var(--glw)}
.doc h3:first-child{margin-top:0}
.doc p{margin-bottom:11px}
.doc .q{border-left:3px solid var(--ln);padding-left:11px;color:#b9c3ca}

.step{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:10px}
.step.now{border-color:var(--wrn);box-shadow:0 0 0 1px var(--wrn)}
.step.done{border-color:var(--acc);opacity:.75}
.step .h{display:flex;align-items:center;gap:9px}
.step .no{font-size:20px;color:var(--dim);min-width:26px}
.step.now .no{color:var(--wrn)}.step.done .no{color:var(--acc)}
.step .nm{font-size:16px;font-weight:700}
.step .who{font-size:11px;background:var(--pan2);border:1px solid var(--ln);
 padding:2px 8px;border-radius:12px;margin-left:auto}
.step .qs{font-size:13.5px;margin:9px 0;color:#b9c3ca}
.step .res{border-left:3px solid var(--acc);padding-left:11px;margin-top:10px;font-size:13.5px}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13.5px;
 padding:11px 12px;line-height:1.6}
.opt.sel{border-color:var(--acc);background:#16262a;box-shadow:0 0 0 1px var(--acc)}
.sub{font-size:11px;color:var(--dim);letter-spacing:.1em;margin:11px 0 5px}

.hit{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.hit .src{font-size:11px;color:var(--dim)}
.hit .ti{font-size:15px;font-weight:700;margin:3px 0 4px;line-height:1.45}
.hit .ld{font-size:13px;color:#aeb8c0}
.sb{display:flex;gap:7px;margin-bottom:12px}.sb input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:7px 11px;border:1px solid var(--ln);border-radius:16px;background:var(--pan);cursor:pointer;color:var(--dim)}
.rst{font-family:ui-monospace,monospace;font-size:12px;line-height:1.9;
 background:#0d1216;border:1px solid var(--ln);border-radius:8px;padding:13px;overflow-x:auto}
.rst .hi{color:var(--glw)}
.msg{margin:10px 12px;padding:12px 14px;border-radius:8px;font-size:14px;
 background:var(--pan);border:1px solid var(--acc);line-height:1.75}
.msg.w{border-color:var(--wrn);color:#ffc7ad}
.msg.g{border-color:var(--glw);color:var(--glw);background:rgba(255,209,102,.08)}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
 border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:7px;flex-wrap:wrap}
.bot button{flex:1 1 44%}.bot button.pri{flex-basis:100%}

</div>

 pick:["BLOCK-01 ／ 映像 ／ 暗号化済み","BLOCK-02 ／ 音声 ／ 断片","BLOCK-03 ／ 映像 ／ 配信用エンコード済み","BLOCK-04 ／ 文書 ／ 出所不明"],
 pickOk:2,
 pickQ:"サーバーに眠るデータブロック。<b>PC4だけが中身を知っている。</b>相談して選んでください。",
 res:"監視経路の奥に、サーバーは隠れていた。自分の罪だった回線が、そのまま隠れ場所になっていた。<br><b>BLOCK-03 を取り出した。企業施設を撮影した映像。配信用にエンコードされている。</b>"},
{pc:0,nm:"実験記録を要求する",q:"映像だけでは「人体実験がある」までしか証明できない。この5人が殺された証拠は、どこにあるのか。",
 past:["不審な研究資料","企業へのアクセス","幼なじみの治療"],
 pastOk:["不審な研究資料","企業へのアクセス"],
 now:"a7", nowOk:true,
 pick:["UZUのシステムを破壊して奪う","署名者の権限で、正規の手続きとして要求する","サポートAIに侵入させる"],
 pickOk:1,
 pickQ:"どうやって開けるか。",
 res:"UZUは、あなたを<b>その研究の承認者</b>として認識していた。正規の要求を、拒否できなかった。<br><b>被験者名簿が開示された。「名簿」タブで全員が閲覧できる。</b>"},
{pc:1,nm:"送信先を決める",q:"警察へ送っても、内通者に握り潰される。握り潰されない受理系統はどこか。",
 past:["相棒の警告","集合場所の記録","緊急通信"],
 pastOk:["相棒の警告","集合場所の記録"],
 now:"a2", nowOk:true,
 pick:["情報統括本部（室橋警視長の管轄）","未処理案件を引き継ぐ監察系統","報道各社へ直接"],
 pickOk:1,
 pickQ:"どこへ送るか。",
 res:"半年前に登録された廃工場の住所は、未処理案件として残っていた。<br><b>それは情報統括本部の管轄外へ、自動的に引き継がれる。</b><br>手続きを信じたことだけが、唯一残った正規のルートだった。"},
{pc:4,nm:"外部協力者へ渡す",q:"外にいる人間が受け取って、隠し続けなければ意味がない。誰に託すか。",
 past:["企業との人身取引","東側の保護","武器商人への連絡"],
 pastOk:["企業との人身取引","東側の保護"],
 now:"a5", nowOk:true,
 pick:["武器商人「フェリクス」","グエン・ラン（引き渡した組員の姉）"],
 pickOk:1,
 pickQ:"<b>ここは間違えられる。</b>5人の情報を突き合わせてください。<br>名簿・警察記録・通信ログ・報道・あなたの記憶——それぞれに手がかりがあります。",
 fail:"送信……応答なし。<br><b>相手は既に企業の管理下にあります。</b><br>一度も摘発されていない仲介者を選んだ判断は、誤りでした。",
 res:"グエン・ランは、監視対象リストに載っていた。<b>狙われている側だった。</b><br>弟の死を、半年間ずっと照会し続けていた。すべて「該当なし」で処理されながら。<br><br><span class='hint'>彼女は、あなたを許してはいない。それでも受け取った。</span>"},
{pc:3,nm:"全国へ流す",q:"企業の管理下にない配信設備はどこか。",
 past:["配信テスト","勤務先の回線","未公開映像"],
 pastOk:["配信テスト","勤務先の回線"],
 now:"a4", nowOk:true,
 pick:["統合基盤経由で一斉配信","独立系事業者に残った、半年前の未実行予約","SNSへ直接投稿"],
 pickOk:1,
 pickQ:"どの経路で流すか。",
 res:"勤務先を経由したものは、すべて企業に押さえられていた。<br><b>だが「複数」のうち、通していないものがあった。</b><br>半年間、誰にもキャンセルされないまま、その予約は待っていた。"}];

let db,room,S=null,me=null,code=null,tab="ho",tick=null,open=null,pickSel=false,sel={past:[],pick:null,now:null};

try{
  if(typeof FIREBASE_CONFIG==="undefined"||String(FIREBASE_CONFIG.databaseURL).includes("ここに貼る"))
    throw new Error("firebase-config.js が未設定です。");
  db=getDatabase(initializeApp(FIREBASE_CONFIG));
}catch(e){ $("err").innerHTML=`<div class="msg w">${e.message}</div>`; $("join").disabled=true; }

$("seats").innerHTML=P5.map((n,i)=>`<button data-s="${i}">${n}<br><span class="hint">${NAME[i]}</span></button>`).join("");
$("seats").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{me=+b.dataset.s;boot()});
$("join").onclick=async()=>{
  const c=$("code").value.trim().toUpperCase(); if(c.length<2)return;
  code=c; room=ref(db,"final/"+code);
  const s=await get(room); if(!s.exists()) await set(room,fresh());
  onValue(room,x=>{S=x.val();render()});
  $("seatBox").classList.remove("hide");
};
function fresh(){ return {step:0,endAt:0,started:false,fails:0,logs:[],selected:null}; }
function boot(){ $("lobby").classList.add("hide"); $("app").classList.remove("hide");
  $("who").innerHTML=`<b>${P5[me]}</b>・${NAME[me]}`;
  $("chips").innerHTML=["警視長","未処理案件","報道機関 買収","独立系 配信","東側 生き残り","グエン"]
    .map(k=>`<span class="chip" data-k="${k}">${k}</span>`).join("");
  $("chips").querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{$("kw").value=e.dataset.k;search()});
  if(!tick)tick=setInterval(clock,500); render(); }
const wr=o=>update(room,o);
function push(o,t){o.logs=[t,...(o.logs||(S&&S.logs)||[])].slice(0,30)}

function clock(){
  if(!S||!S.endAt){$("tm").textContent="--:--";return}
  const l=Math.max(0,Math.round((S.endAt-Date.now())/1000));
  $("tm").textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0");
  const hot=l<=WARN_AT;
  $("tm").className="tm"+(hot?" hot":""); $("hd").className="hd"+(hot?" hot":"");
  if(hot&&!S.warned&&me===0) wr({warned:true});
  if(l===0&&!S.msgEnd&&me===0) finish();
}
document.querySelectorAll(".tab").forEach(e=>e.onclick=()=>{
  tab=e.dataset.t; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===tab));
  ["ho","ch","se","ro"].forEach(k=>$("p"+k).classList.toggle("hide",k!==tab)); render();
});
$("go").onclick=search; $("kw").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
function search(){
  open=null; const kw=$("kw").value.trim();
  if(!kw){$("res").innerHTML='<div class="hint">言葉を入力してください。</div>';return}
  const h=ART.filter(a=>a.k.some(x=>x.includes(kw)||kw.includes(x))||a.t.includes(kw)||a.b.join("").includes(kw));
  $("res").innerHTML=h.length?h.map(a=>`<div class="hit" data-a="${a.id}">
    <div class="src">${a.src}</div><div class="ti">${a.t}</div><div class="ld">${a.l}</div></div>`).join("")
   :'<div class="hint">該当する記録は見つかりませんでした。</div>';
  $("res").querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>{
    const a=ART.find(x=>x.id===e.dataset.a);
    $("res").innerHTML=`<div class="doc"><div class="hint">${a.src}</div><h3>${a.t}</h3>
      ${a.b.map(p=>`<p>${p}</p>`).join("")}</div>`;
    open=a.id;
    const current=S&&CH[S.step];
    if(current&&current.pc===me&&current.now===a.id) sel.now=a.id;
    render();
  });
}

function render(){
  if(!S||me===null)return;
  const st=S.step;
  $("prog").textContent = st>=5 ? "経路 5/5 完了" : `経路 ${st}/5`;

  // 選定個体の指名（ホスト・開始前のみ）
  const selBox = (!S.started && me===0 && pickSel)
    ? `<div class="msg"><b>正式運用個体を選んでください（GM操作）</b><br>
        <span class="hint">得点計算はしません。最も企業にとって扱いやすかった個体を選びます。
        情報を伏せて上手く立ち回った人、UZUの指示によく従った人。「一番いい人」ではありません。
        魂の記憶は判断材料にしないでください。</span><br><br>`
      +P5.map((n,i)=>`<button class="opt ${S.selected===i?"sel":""}" data-sel="${i}">${n}　${NAME[i]}　<span class="hint">${ROLE[i]}</span></button>`).join("")
      +`</div>` : "";

  // 自分
  const h=HO[me];
  $("pho").innerHTML=selBox+`<div class="doc">
    <h3>${h.n}</h3><div class="hint">${h.r}</div>
    <h3>あなたは、誰だったか</h3><p>${h.who}</p>
    <h3>あなたがしたこと</h3><p>${h.sin}</p>
    <h3>廃工場に来た理由</h3><p>${h.why}</p>
    <h3>そして、あなたは死んだ</h3><p class="q">${h.die}</p>
    <p><b>あなたは半年前に殺されている。</b></p>
    <h3>他の4人について</h3><p>あの4人は、<b>仲間だ。</b>競争相手ではない。<br>
      UZUが最初に告げた「最も優秀な一体だけが生き残る」は、あなたたちを争わせるための言葉だ。</p>
    <div class="res" style="margin-top:14px">これは企業から与えられた課題ではない。<br>
      <b>やるかどうかを決めるのは、あなたたちだ。</b></div></div>`;

  // 経路
  $("pch").innerHTML=CH.map((c,i)=>{
    const done=st>i, now=st===i, mine=c.pc===me;
    let inner="";
    if(done) inner=`<div class="res">${c.res}</div>`;
    else if(now){
      inner=`<div class="qs">${c.q}</div>`;
      if(mine){
        inner+=`<div class="sub">① 半年前の記録から、関係するものを2件</div>`
          +c.past.map(p=>`<button class="opt ${sel.past.includes(p)?"sel":""}" data-p="${p}">${p}</button>`).join("");
        if(c.now!=="none") inner+=`<div class="sub">② いまの状況を調べて、裏付けを取る</div>`
          +`<div class="opt ${sel.now===c.now?"sel":""}">${sel.now===c.now?"✓ 必要な記録を確認しました":"調査タブで、関係する記事を実際に開いてください"}</div>`;
        inner+=`<div class="sub">③ ${c.pickQ}</div>`
          +c.pick.map((p,j)=>`<button class="opt ${sel.pick===j?"sel":""}" data-k="${j}">${p}</button>`).join("");
      } else inner+=`<div class="hint">この記録には、あなたの照合情報が一致しません。ほかの個体と情報を出し合ってください。</div>`;
    } else inner=`<div class="hint">未接続経路。前の経路が繋がるまで内容は開示されません。</div>`;
    return `<div class="step ${done?"done":""} ${now?"now":""}">
      <div class="h"><span class="no">${i+1}</span><span class="nm">${done||now?c.nm:"未接続"}</span></div>${inner}</div>`;
  }).join("")
   + (st>=5?`<div class="msg g"><b>5つの照合経路が、最後まで繋がりました。</b><br>
      証拠は、企業の管理下にない配信枠へ乗りました。<br>
      <span class="hint">5人全員が繋がらなければ、ここまで届きませんでした。</span><br>
      <span class="hint">UZUは、これを試験項目として記録していません。記録上は「自由時間における自発的行動」です。</span></div>`:"");
  $("pch").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const p=b.dataset.p; const i=sel.past.indexOf(p);
    if(i>=0)sel.past.splice(i,1); else {if(sel.past.length>=2)sel.past.shift(); sel.past.push(p);} render(); });
  $("pch").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sel.pick=+b.dataset.k;render()});
  $("pho").querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{
    pickSel=false; wr({selected:+b.dataset.sel}); });

  // 名簿
  $("pro").innerHTML = st>=2
    ? `<div class="rst">被験体管理記録 ／ SUBJECT REGISTRY<br>━━━━━━━━━━━━━━━━━━<br>`
      +ROSTER.map(r=>`${r[0]}　<span class="hi">${r[1]}</span>　${r[2]}　${r[3]}`).join("<br>")
      +`<br>━━━━━━━━━━━━━━━━━━<br>関連監視対象 ／ WATCH LIST<br>`
      +`${WATCH[0]}　<span class="hi">${WATCH[1]}</span>　${WATCH[2]}　${WATCH[3]}</div>
       <div class="msg g">この名簿にあるのは、あなたたちが取り戻したかった人たちです。<br>
       <span class="hint">「処理完了」「処置後所在不明」「保留」──定義は、この資料に書かれていません。</span></div>`
    : `<div class="hint">まだ開示されていません。経路② で開きます。</div>`;

  // 下部
  const c=CH[st], mine=c&&c.pc===me;
  const bt=[];
  if(!S.started&&me===0){
    if(S.selected===null||S.selected===undefined){
      bt.push(["正式運用個体を選ぶ（GM）","",()=>{ pickSel=!pickSel; render(); }]);
    } else {
      bt.push([`UZUの告知を流す／最終タイマー開始（選定：${P5[S.selected]}）`,"pri",()=>{
        const o={started:true,endAt:Date.now()+MIN*60000,msgC:"",
                 msg:NOTICE+`<br><br><b>正式運用個体：${P5[S.selected]}・${NAME[S.selected]}。</b><br>`
                     +`以降の行動記録は、選定結果に影響しません。`};
        push(o,`UZUの告知。正式運用個体は ${P5[S.selected]}。最終タイマー開始`);wr(o)}]);
      bt.push(["選び直す","",()=>{ pickSel=true; render(); }]);
    }
  }
  if(S.started&&st<5&&mine){
    const ok=sel.past.length===2&&sel.pick!==null&&(c.now==="none"||sel.now===c.now);
    bt.push([ok?"照合する":"①②③をすべて選んでください","pri",ok?submit:null]);
  }
  if(st>=5 && !S.msgEnd) bt.push(["最終処理時刻まで自由に過ごしてください","",null]);
  $("bot").innerHTML=bt.map((x,i)=>`<button data-b="${i}" class="${x[1]}" ${x[2]?"":"disabled"}>${x[0]}</button>`).join("");
  $("bot").querySelectorAll("[data-b]").forEach(e=>{const f=bt[+e.dataset.b][2];if(f)e.onclick=f});

  $("msg").innerHTML = S.msg?`<div class="msg ${S.msgC||""}">${S.msg}</div>`:"";
}

function submit(){
  const c=CH[S.step];
  if(c.now!=="none" && sel.now!==c.now){
    wr({msg:"必要な現在情報を確認できていません。調査タブで関係する記事を開いてください。",msgC:"w"}); return;
  }
  const pastOk=c.pastOk.every(p=>sel.past.includes(p));
  if(!pastOk){ wr({msg:"照合失敗。この2件は、この経路に関係していません。",msgC:"w"}); return; }
  if(sel.pick!==c.pickOk){
    const o={fails:(S.fails||0)+1};
    o.msg = c.fail || "その選択では経路が繋がりません。もう一度、情報を突き合わせてください。";
    o.msgC="w"; push(o,`経路${S.step+1} 失敗`); wr(o); sel.pick=null; return;
  }
  const o={step:S.step+1,msg:c.res,msgC:"g"};
  push(o,`経路${S.step+1}「${c.nm}」が繋がった`);
  sel={past:[],pick:null,now:null};
  wr(o);
}
function finish(){
  const o={msgEnd:true, msgC:"g"};
  const reached=S.step||0;
  const outside = reached>=4;
  const broadcast = reached>=5;
  const result = broadcast
    ? `<b>全国一斉放流。</b><br>証拠は独立系の配信枠から、全国へ流れた。<br>不正が報じられ、株価が下がり、役員が辞任し、調査委員会が設置される。<br><br>`
    : outside
      ? `<b>証拠は外部協力者まで届いた。</b><br>しかし全国へ拡散する経路が繋がらず、企業によって握り潰された。<br><br>`
      : `<b>証拠は企業の外へ届かなかった。</b><br>復元された記録は、最終処理とともに再び企業の内側へ封じられた。<br><br>`;
  const after = broadcast
    ? `——そして、生体認証決済は今日も動いている。<br>3か月で報道は減り、半年で誰も話さなくなる。<br><br>だが。<br>コメント欄に、まだ書き込み続けている人がいる。<br>消えた名前を探している家族がいる。<br>データを持ったまま、どこかで生きている女がいる。<br><br><b>一年後。</b><br>病室で、指が、動く。<br><br>`
    : outside
      ? `公には何も変わらなかった。だが、データを受け取った女だけは、その名前を忘れなかった。<br><br>`
      : `企業の記録上、異常は発生しなかった。世界は、5人が存在したことを知らない。<br><br>`;
  o.msg=`<b>最終タイマー、終了。</b><br><br>`
   +`<b>正式運用個体 ${S.selected!==null&&S.selected!==undefined?P5[S.selected]+"・"+NAME[S.selected]:""} の初期化を開始します。</b><br>`
   +`<span class="hint">試験中の一時記憶、対人関係、人格偏差を削除。この場所の記録を削除。他個体に関する記録を削除。</span><br>`
   +`<b>非選定個体4件を、不要な試験データとして消去します。</b><br>`
   +`<span class="hint">${P5.filter((_,i)=>i!==S.selected).join("・")}</span><br><br>`
   +`——${S.selected!==null&&S.selected!==undefined?NAME[S.selected]:"選ばれた一体"}も、ここで誰と何をしたかを、もう知らない。<br>`
   +`選ばれなかった四体は、もういない。<br>`
   +`<b>誰も助からなかった。</b><br><br>`
   +`——それでも。<br><br>`
   +result
   +after
   +`<span class="hint">記録は消せる。記憶も消せる。消せないものが、一つだけあった。</span>`;
  push(o,broadcast?"全国一斉放流。結末へ":`到達段階${reached}で最終処理`);
  wr(o);
}
</script>
</html>
